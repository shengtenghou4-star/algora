name: HTFI v32 FD53 blinded source census

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  metadata-census:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Query Crossref metadata only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import hashlib, json, re, time, urllib.parse, urllib.request, urllib.error
          from collections import defaultdict

          years = [2012, 2013, 2014, 2015, 2018, 2020, 2025]

          # Frozen before first query. These terms are source-discovery terms only;
          # they do not alter the preregistered eligibility rule.
          queries = [
              '"ASTM D4172" lubricant',
              '"ASTM D4172" oil',
              '"four-ball wear" lubricant'
          ]

          def redact_title(s):
              # Do not emit numerical result-like tokens from titles.
              toks = re.split(r"(\s+)", s)
              kept = []
              for tok in toks:
                  if any(ch.isdigit() for ch in tok):
                      continue
                  if re.search(r"[%/×·^=<>~±µμ]", tok):
                      continue
                  kept.append(tok)
              return re.sub(r"\s+", " ", "".join(kept)).strip()

          def fetch(url):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent":"HTFI-source-census/1.0 (metadata-only research)"}
              )
              attempts = []
              for attempt in range(1, 6):
                  try:
                      with urllib.request.urlopen(req, timeout=90) as resp:
                          payload = json.load(resp)
                      attempts.append({"attempt":attempt,"status":"success"})
                      return payload, attempts
                  except urllib.error.HTTPError as e:
                      attempts.append({"attempt":attempt,"status":f"http_{e.code}"})
                      if e.code != 429 or attempt == 5:
                          raise
                      time.sleep(5 * attempt)

          records = {}
          receipts = []
          for year in years:
              for q in queries:
                  params = {
                      "query.bibliographic": q,
                      "filter": f"from-pub-date:{year}-01-01,until-pub-date:{year}-12-31",
                      "select": "DOI,title,published,container-title,type,URL",
                      "rows": "1000"
                  }
                  url = "https://api.crossref.org/works?" + urllib.parse.urlencode(params)
                  payload, attempts = fetch(url)
                  items = payload.get("message",{}).get("items",[])
                  receipts.append({
                      "year":year,
                      "query":q,
                      "items_returned":len(items),
                      "attempts":attempts
                  })
                  for it in items:
                      doi = (it.get("DOI") or "").strip()
                      titles = it.get("title") or []
                      title = titles[0].strip() if titles else ""
                      venue = " | ".join(it.get("container-title") or []).strip()
                      if not doi or not title:
                          continue
                      tl = title.lower()
                      # Metadata-only relevance screen. Do not infer Condition B eligibility here.
                      discovery_signal = (
                          "d4172" in tl or
                          ("four" in tl and "ball" in tl and "wear" in tl) or
                          ("four-ball" in tl and "wear" in tl)
                      )
                      if not discovery_signal:
                          continue
                      key = doi.lower()
                      records[key] = {
                          "year":year,
                          "doi":doi,
                          "venue":venue,
                          "type":it.get("type"),
                          "title_sha256":hashlib.sha256(title.encode("utf-8")).hexdigest(),
                          "title_redacted":redact_title(title),
                          "metadata_discovery_signal":True,
                          "condition_b_verified":False,
                          "raw_title_retained":False,
                          "abstract_requested":False,
                          "performance_value_extracted":False
                      }
                  time.sleep(2)

          recs = sorted(records.values(), key=lambda r:(r["year"],r["doi"]))
          counts = defaultdict(int)
          for r in recs:
              counts[str(r["year"])] += 1

          out = {
              "schema":"HTFI-v32-FD53-blinded-source-census-stage1-v1",
              "candidate":"FD53",
              "frozen_metric":"FPM=1/four_ball_wear_scar_mm",
              "frozen_source_rule":"Manufacturer technical data or peer-reviewed measurements; ASTM D4172 Condition B exactly (40 kg, 75C, 1200 rpm, 60 min); finished lubricants only; no alternate load/time/temperature conditions.",
              "stage":"METADATA_DISCOVERY_ONLY",
              "required_years":years,
              "queries_frozen_before_first_request":queries,
              "abstracts_requested":False,
              "raw_titles_retained":False,
              "performance_values_intentionally_extracted":False,
              "condition_b_eligibility_decided":False,
              "records":recs,
              "year_counts":dict(counts),
              "metadata_candidate_continuity":all(counts[str(y)] > 0 for y in years),
              "next_stage_if_pass":"Blind full-text/source-document boolean check for exact Condition B and finished-lubricant eligibility; never emit wear-scar values."
          }
          with open("out/fd53_stage1_blinded_metadata_census.json","w",encoding="utf-8") as f:
              json.dump(out,f,indent=2,ensure_ascii=False)
          with open("out/request_receipts.json","w",encoding="utf-8") as f:
              json.dump(receipts,f,indent=2,ensure_ascii=False)
          with open("out/SHA256SUMS.txt","w",encoding="utf-8") as f:
              for p in ["out/fd53_stage1_blinded_metadata_census.json","out/request_receipts.json"]:
                  b=open(p,"rb").read()
                  f.write(hashlib.sha256(b).hexdigest()+"  "+p.split("/")[-1]+"\n")
          print("FD53 stage-1 metadata census complete; no abstracts or performance values emitted")
          PY

      - name: Upload blinded census
        uses: actions/upload-artifact@v4
        with:
          name: htfi-v32-fd53-stage1-blinded-source-census
          path: out/
          retention-days: 1

  protocol-census:
    needs: metadata-census
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download stage-1 blinded metadata
        uses: actions/download-artifact@v4
        with:
          name: htfi-v32-fd53-stage1-blinded-source-census
          path: stage1

      - name: Blind-check exact Condition B protocol in accessible source text
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out2 tmp
          python - <<'PY'
          import hashlib, json, re, subprocess, time, urllib.parse, urllib.request, urllib.error
          from pathlib import Path

          stage1 = json.load(open("stage1/fd53_stage1_blinded_metadata_census.json", encoding="utf-8"))
          records = stage1["records"]

          # Frozen before source retrieval. These are protocol/class signals only,
          # not outcome/performance extraction rules.
          protocol_patterns = {
              "astm_d4172": r"(?i)D\s*[- ]?4172",
              "load_40kg": r"(?i)\b40\s*(?:kg|kilograms?)\b",
              "temperature_75c": r"(?i)\b75\s*(?:°|deg(?:ree)?s?\s*)?C\b",
              "speed_1200rpm": r"(?i)\b1200\s*(?:rpm|r\s*/\s*min|rev(?:olutions?)?\s*(?:per|/)\s*min(?:ute)?)\b",
              "duration_60min": r"(?i)\b60\s*(?:min(?:ute)?s?)\b"
          }
          finished_patterns = [
              r"(?i)\bengine\s+oil\b",
              r"(?i)\bmotor\s+oil\b",
              r"(?i)\bhydraulic\s+(?:fluid|oil)\b",
              r"(?i)\bgear\s+oil\b",
              r"(?i)\btransmission\s+fluid\b",
              r"(?i)\bturbine\s+oil\b",
              r"(?i)\bcompressor\s+oil\b",
              r"(?i)\blubricating\s+oil\b",
              r"(?i)\bcommercial\s+lubricant\b",
              r"(?i)\bfinished\s+lubricant\b",
              r"(?i)\b(?:lubricating\s+)?grease\b"
          ]

          def http_json(url):
              req=urllib.request.Request(url,headers={"User-Agent":"HTFI-source-census/1.0"})
              with urllib.request.urlopen(req,timeout=45) as resp:
                  return json.load(resp)

          def fetch_bytes(url, max_bytes=12_000_000):
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 HTFI-source-census/1.0"})
              with urllib.request.urlopen(req,timeout=45) as resp:
                  ctype=(resp.headers.get("Content-Type") or "").lower()
                  final=resp.geturl()
                  data=resp.read(max_bytes+1)
                  if len(data)>max_bytes:
                      return None, ctype, final, "too_large"
                  return data, ctype, final, "ok"

          def html_to_text(data):
              s=data.decode("utf-8","ignore")
              s=re.sub(r"(?is)<script.*?</script>|<style.*?</style>"," ",s)
              s=re.sub(r"(?s)<[^>]+>"," ",s)
              s=re.sub(r"&(?:nbsp|amp|lt|gt|quot|#39);"," ",s)
              return re.sub(r"\s+"," ",s)

          def pdf_to_text(data, stem):
              p=Path("tmp")/(stem+".pdf")
              t=Path("tmp")/(stem+".txt")
              p.write_bytes(data)
              if subprocess.run(["bash","-lc","command -v pdftotext >/dev/null 2>&1"]).returncode != 0:
                  return None
              cp=subprocess.run(["pdftotext","-q",str(p),str(t)],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              if cp.returncode!=0 or not t.exists():
                  return None
              return t.read_text(errors="ignore")

          def candidate_urls(doi):
              urls=[]
              # OpenAlex is used only to discover lawful OA/landing locations.
              try:
                  oa=http_json("https://api.openalex.org/works/https://doi.org/"+urllib.parse.quote(doi,safe=""))
                  for loc in [oa.get("best_oa_location"), oa.get("primary_location")]:
                      if loc:
                          for k in ["pdf_url","landing_page_url"]:
                              u=loc.get(k)
                              if u and u not in urls: urls.append(u)
                  for loc in oa.get("locations") or []:
                      if loc:
                          for k in ["pdf_url","landing_page_url"]:
                              u=loc.get(k)
                              if u and u not in urls: urls.append(u)
              except Exception:
                  pass
              u="https://doi.org/"+doi
              if u not in urls: urls.append(u)
              return urls[:8]

          out_records=[]
          for idx,r in enumerate(records):
              doi=r["doi"]
              combined=""
              access=[]
              for j,u in enumerate(candidate_urls(doi)):
                  try:
                      data,ctype,final,status=fetch_bytes(u)
                      if data is None:
                          access.append({"source_index":j,"status":status})
                          continue
                      text=None
                      if "pdf" in ctype or data[:4]==b"%PDF":
                          text=pdf_to_text(data, f"{idx}_{j}")
                          kind="pdf"
                      else:
                          text=html_to_text(data)
                          kind="html"
                      access.append({"source_index":j,"status":"parsed" if text else "unparsed","kind":kind})
                      if text:
                          combined += "\n" + text
                  except Exception as e:
                      access.append({"source_index":j,"status":"fetch_error","error_class":type(e).__name__})
                  time.sleep(0.5)

              sig={k:bool(re.search(p,combined)) for k,p in protocol_patterns.items()}
              exact_protocol=all(sig.values())
              finished_signal=any(re.search(p,combined) for p in finished_patterns)
              out_records.append({
                  "year":r["year"],
                  "doi":doi,
                  "title_sha256":r["title_sha256"],
                  "source_text_accessible":bool(combined.strip()),
                  "protocol_signals":sig,
                  "exact_condition_b_signal":exact_protocol,
                  "finished_lubricant_strong_signal":finished_signal,
                  "stage2_candidate_signal":bool(exact_protocol and finished_signal),
                  "source_attempts":access,
                  "raw_source_text_retained":False,
                  "performance_value_extracted":False
              })
              # Raw source text exists only transiently in this process variable.
              combined=""

          years=stage1["required_years"]
          year_summary={}
          for y in years:
              rr=[x for x in out_records if x["year"]==y]
              year_summary[str(y)]={
                  "stage1_records":len(rr),
                  "source_text_accessible":sum(x["source_text_accessible"] for x in rr),
                  "exact_condition_b_signal":sum(x["exact_condition_b_signal"] for x in rr),
                  "exact_condition_b_and_finished_signal":sum(x["stage2_candidate_signal"] for x in rr)
              }

          out={
              "schema":"HTFI-v32-FD53-blinded-source-census-stage2-v1",
              "candidate":"FD53",
              "parent_stage1_sha256":hashlib.sha256(open("stage1/fd53_stage1_blinded_metadata_census.json","rb").read()).hexdigest(),
              "stage":"BLIND_PROTOCOL_AND_CLASS_BOOLEAN_CHECK",
              "performance_values_intentionally_extracted":False,
              "raw_source_text_retained":False,
              "protocol_constants_are_preregistered_not_outcomes":True,
              "records":out_records,
              "year_summary":year_summary,
              "stage2_signal_continuity":all(year_summary[str(y)]["exact_condition_b_and_finished_signal"]>0 for y in years),
              "decision_scope":"Boolean source/protocol continuity only. A pass does not extract or score wear-scar outcomes."
          }
          with open("out2/fd53_stage2_blinded_protocol_census.json","w",encoding="utf-8") as f:
              json.dump(out,f,indent=2,ensure_ascii=False)
          b=open("out2/fd53_stage2_blinded_protocol_census.json","rb").read()
          open("out2/SHA256SUMS.txt","w").write(hashlib.sha256(b).hexdigest()+"  fd53_stage2_blinded_protocol_census.json\n")
          print("FD53 stage-2 blind protocol census complete; no raw source text or performance values uploaded")
          PY

      - name: Upload stage-2 blinded protocol census
        uses: actions/upload-artifact@v4
        with:
          name: htfi-v32-fd53-stage2-blinded-protocol-census
          path: out2/
          retention-days: 1
