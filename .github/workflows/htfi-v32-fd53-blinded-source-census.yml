name: HTFI v32 FD53 blinded source census

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  metadata-census:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Query Crossref metadata only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import hashlib, json, re, time, urllib.parse, urllib.request, urllib.error
          from collections import defaultdict

          years = [2012, 2013, 2014, 2015, 2018, 2020, 2025]

          # Frozen before first query. These terms are source-discovery terms only;
          # they do not alter the preregistered eligibility rule.
          queries = [
              '"ASTM D4172" lubricant',
              '"ASTM D4172" oil',
              '"four-ball wear" lubricant'
          ]

          def redact_title(s):
              # Do not emit numerical result-like tokens from titles.
              toks = re.split(r"(\s+)", s)
              kept = []
              for tok in toks:
                  if any(ch.isdigit() for ch in tok):
                      continue
                  if re.search(r"[%/×·^=<>~±µμ]", tok):
                      continue
                  kept.append(tok)
              return re.sub(r"\s+", " ", "".join(kept)).strip()

          def fetch(url):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent":"HTFI-source-census/1.0 (metadata-only research)"}
              )
              attempts = []
              for attempt in range(1, 6):
                  try:
                      with urllib.request.urlopen(req, timeout=90) as resp:
                          payload = json.load(resp)
                      attempts.append({"attempt":attempt,"status":"success"})
                      return payload, attempts
                  except urllib.error.HTTPError as e:
                      attempts.append({"attempt":attempt,"status":f"http_{e.code}"})
                      if e.code != 429 or attempt == 5:
                          raise
                      time.sleep(5 * attempt)

          records = {}
          receipts = []
          for year in years:
              for q in queries:
                  params = {
                      "query.bibliographic": q,
                      "filter": f"from-pub-date:{year}-01-01,until-pub-date:{year}-12-31",
                      "select": "DOI,title,published,container-title,type,URL",
                      "rows": "1000"
                  }
                  url = "https://api.crossref.org/works?" + urllib.parse.urlencode(params)
                  payload, attempts = fetch(url)
                  items = payload.get("message",{}).get("items",[])
                  receipts.append({
                      "year":year,
                      "query":q,
                      "items_returned":len(items),
                      "attempts":attempts
                  })
                  for it in items:
                      doi = (it.get("DOI") or "").strip()
                      titles = it.get("title") or []
                      title = titles[0].strip() if titles else ""
                      venue = " | ".join(it.get("container-title") or []).strip()
                      if not doi or not title:
                          continue
                      tl = title.lower()
                      # Metadata-only relevance screen. Do not infer Condition B eligibility here.
                      discovery_signal = (
                          "d4172" in tl or
                          ("four" in tl and "ball" in tl and "wear" in tl) or
                          ("four-ball" in tl and "wear" in tl)
                      )
                      if not discovery_signal:
                          continue
                      key = doi.lower()
                      records[key] = {
                          "year":year,
                          "doi":doi,
                          "venue":venue,
                          "type":it.get("type"),
                          "title_sha256":hashlib.sha256(title.encode("utf-8")).hexdigest(),
                          "title_redacted":redact_title(title),
                          "metadata_discovery_signal":True,
                          "condition_b_verified":False,
                          "raw_title_retained":False,
                          "abstract_requested":False,
                          "performance_value_extracted":False
                      }
                  time.sleep(2)

          recs = sorted(records.values(), key=lambda r:(r["year"],r["doi"]))
          counts = defaultdict(int)
          for r in recs:
              counts[str(r["year"])] += 1

          out = {
              "schema":"HTFI-v32-FD53-blinded-source-census-stage1-v1",
              "candidate":"FD53",
              "frozen_metric":"FPM=1/four_ball_wear_scar_mm",
              "frozen_source_rule":"Manufacturer technical data or peer-reviewed measurements; ASTM D4172 Condition B exactly (40 kg, 75C, 1200 rpm, 60 min); finished lubricants only; no alternate load/time/temperature conditions.",
              "stage":"METADATA_DISCOVERY_ONLY",
              "required_years":years,
              "queries_frozen_before_first_request":queries,
              "abstracts_requested":False,
              "raw_titles_retained":False,
              "performance_values_intentionally_extracted":False,
              "condition_b_eligibility_decided":False,
              "records":recs,
              "year_counts":dict(counts),
              "metadata_candidate_continuity":all(counts[str(y)] > 0 for y in years),
              "next_stage_if_pass":"Blind full-text/source-document boolean check for exact Condition B and finished-lubricant eligibility; never emit wear-scar values."
          }
          with open("out/fd53_stage1_blinded_metadata_census.json","w",encoding="utf-8") as f:
              json.dump(out,f,indent=2,ensure_ascii=False)
          with open("out/request_receipts.json","w",encoding="utf-8") as f:
              json.dump(receipts,f,indent=2,ensure_ascii=False)
          with open("out/SHA256SUMS.txt","w",encoding="utf-8") as f:
              for p in ["out/fd53_stage1_blinded_metadata_census.json","out/request_receipts.json"]:
                  b=open(p,"rb").read()
                  f.write(hashlib.sha256(b).hexdigest()+"  "+p.split("/")[-1]+"\n")
          print("FD53 stage-1 metadata census complete; no abstracts or performance values emitted")
          PY

      - name: Upload blinded census
        uses: actions/upload-artifact@v4
        with:
          name: htfi-v32-fd53-stage1-blinded-source-census
          path: out/
          retention-days: 1
