name: HTFI FD36 SQLite source bridge

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fetch-sqlite-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch and validate official SQLite amalgamations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/sources
          cat > out/releases.tsv <<'EOF'
          2012	3.7.15.1	3071501
          2013	3.8.2	3080200
          2014	3.8.7.4	3080704
          2015	3.9.2	3090200
          2018	3.26.0	3260000
          2020	3.34.0	3340000
          2025	3.51.1	3510100
          EOF
          printf 'year\tversion\tcode\tarchive_sha256\tsqlite3c_sha256\tsqlite3h_sha256\theader_version\n' > out/source_manifest.tsv
          while IFS=$'\t' read -r year version code; do
            d="out/sources/${year}_${version}"
            mkdir -p "$d"
            url="https://www.sqlite.org/${year}/sqlite-amalgamation-${code}.zip"
            echo "$url" > "$d/url.txt"
            curl -L --fail --retry 4 --connect-timeout 20 --max-time 180 -o "$d/archive.zip" "$url"
            unzip -q "$d/archive.zip" -d "$d/unpacked"
            srcdir="$(find "$d/unpacked" -mindepth 1 -maxdepth 1 -type d | head -n1)"
            test -n "$srcdir"
            cp "$srcdir/sqlite3.c" "$d/sqlite3.c"
            cp "$srcdir/sqlite3.h" "$d/sqlite3.h"
            hv="$(awk '/^#define SQLITE_VERSION /{gsub(/\"/,"",$3); print $3; exit}' "$d/sqlite3.h")"
            test "$hv" = "$version"
            asha="$(sha256sum "$d/archive.zip" | awk '{print $1}')"
            csha="$(sha256sum "$d/sqlite3.c" | awk '{print $1}')"
            hsha="$(sha256sum "$d/sqlite3.h" | awk '{print $1}')"
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$year" "$version" "$code" "$asha" "$csha" "$hsha" "$hv" >> out/source_manifest.tsv
          done < out/releases.tsv
          find out -type f -print0 | sort -z | xargs -0 sha256sum > out/ALL_SHA256SUMS.txt
          du -sh out > out/SIZE.txt
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: htfi-fd36-sqlite-official-sources
          path: out/
          retention-days: 1
