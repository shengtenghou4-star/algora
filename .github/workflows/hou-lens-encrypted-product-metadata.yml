name: HOU-LENS encrypted P4.1 product metadata executor

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/hou-lens-encrypted-product-metadata.yml
      - .github/hou-lens-meta-start

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Generate ephemeral runner certificate
        run: |
          set -euo pipefail
          openssl req -x509 -newkey rsa:3072 -nodes -days 1 \
            -subj '/CN=HOU-LENS-P4.1-ephemeral-metadata-runner' \
            -keyout /tmp/runner.key -out runner.crt >/dev/null 2>&1
          python - <<'PY'
          import hashlib, json, os
          raw=open('runner.crt','rb').read()
          json.dump({
            'schema_version':1,
            'stage':'p4_1_ephemeral_metadata_handshake',
            'run_id':os.environ['GITHUB_RUN_ID'],
            'head_sha':os.environ['GITHUB_SHA'],
            'certificate_sha256':hashlib.sha256(raw).hexdigest(),
            'private_key_published':False,
          },open('handshake.json','w'),indent=2)
          PY

      - name: Upload handshake
        uses: actions/upload-artifact@v4
        with:
          name: hou-lens-p4-1-meta-handshake-${{ github.run_id }}
          path: |
            runner.crt
            handshake.json
          retention-days: 2

      - name: Wait for encrypted payload and execute metadata-only queries
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/payload_parts /tmp/work /tmp/result
          found=0
          for attempt in $(seq 1 120); do
            git fetch -q origin "$BRANCH"
            if git show "origin/$BRANCH:.github/hou-lens-meta-payload/manifest.json" >/tmp/manifest.json 2>/dev/null; then
              count=$(python -c "import json; print(json.load(open('/tmp/manifest.json'))['part_count'])")
              complete=1
              : >/tmp/payload.b64
              for idx in $(seq -f '%03g' 1 "$count"); do
                if ! git show "origin/$BRANCH:.github/hou-lens-meta-payload/part-${idx}.b64" >>/tmp/payload.b64 2>/dev/null; then
                  complete=0
                  break
                fi
              done
              if [ "$complete" = 1 ]; then found=1; break; fi
            fi
            sleep 10
          done
          test "$found" = 1
          python - <<'PY'
          import base64, hashlib, json
          m=json.load(open('/tmp/manifest.json'))
          b64=open('/tmp/payload.b64','rb').read()
          if hashlib.sha256(b64).hexdigest()!=m['base64_sha256']: raise SystemExit('base64 hash mismatch')
          der=base64.b64decode(b64,validate=True)
          if hashlib.sha256(der).hexdigest()!=m['cms_der_sha256']: raise SystemExit('CMS hash mismatch')
          open('/tmp/payload.der','wb').write(der)
          PY
          openssl cms -decrypt -binary -inform DER -in /tmp/payload.der \
            -recip runner.crt -inkey /tmp/runner.key -out /tmp/payload.tar.gz
          python - <<'PY'
          import hashlib,json
          m=json.load(open('/tmp/manifest.json'))
          raw=open('/tmp/payload.tar.gz','rb').read()
          if hashlib.sha256(raw).hexdigest()!=m['payload_tar_sha256']: raise SystemExit('payload tar hash mismatch')
          PY
          tar -xzf /tmp/payload.tar.gz -C /tmp/work
          python /tmp/work/metadata_executor.py \
            --plan /tmp/work/P4_1_TILE_PRODUCT_QUERY_PLAN.json \
            --output /tmp/result

      - name: Encrypt private metadata result
        run: |
          set -euo pipefail
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -cf - -C /tmp/result . | gzip -n > /tmp/result.tar.gz
          openssl cms -encrypt -binary -aes256 -outform DER \
            -in /tmp/result.tar.gz -out encrypted-result.cms /tmp/work/result_recipient.crt
          python - <<'PY'
          import hashlib,json,os
          receipt=json.load(open('/tmp/result/receipt.json'))
          encrypted=open('encrypted-result.cms','rb').read()
          tarball=open('/tmp/result.tar.gz','rb').read()
          summary={
            'schema_version':1,
            'stage':'p4_1_encrypted_product_metadata_execution',
            'status':receipt['status'],
            'run_id':os.environ['GITHUB_RUN_ID'],
            'query_count':receipt['query_count'],
            'resolved_tile_count':receipt['resolved_tile_count'],
            'resolved_product_count':receipt['resolved_product_count'],
            'planned_soda_cutout_count':receipt['planned_soda_cutout_count'],
            'private_result_tar_sha256':hashlib.sha256(tarball).hexdigest(),
            'encrypted_result_sha256':hashlib.sha256(encrypted).hexdigest(),
            'tile_product_manifest_sha256':receipt['output_sha256']['tile_product_manifest'],
            'raw_response_set_sha256':receipt['output_sha256']['raw_response_set'],
            'dataset_id_set_sha256':receipt['output_sha256']['dataset_id_set'],
            'image_bytes_downloaded':0,
            'scores_computed':False,
            'plaintext_identity_or_result_published':False,
          }
          json.dump(summary,open('public-summary.json','w'),indent=2)
          print(json.dumps({k:summary[k] for k in ('status','query_count','resolved_product_count','image_bytes_downloaded')},sort_keys=True))
          PY

      - name: Upload encrypted result
        uses: actions/upload-artifact@v4
        with:
          name: hou-lens-p4-1-meta-result-${{ github.run_id }}
          path: |
            encrypted-result.cms
            public-summary.json
          retention-days: 3
