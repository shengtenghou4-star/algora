name: HTFI v32 FD44 blinded metadata bridge

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Query Crossref metadata only for ethylene polymerization catalyst literature
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import hashlib, json, re, time, urllib.parse, urllib.request, urllib.error
          from collections import defaultdict

          years=[2012,2013,2014,2015,2018,2020,2025]
          query="ethylene polymerization catalyst"
          positive=["ethylene","polymer"]
          catalyst_terms=["catalyst","catalytic","catalysis","catalysts"]
          exclusion=["copolymer","co-polymer","copolymerization","co-polymerization"]

          def redact_title(s):
              toks=re.split(r"(\s+)",s)
              kept=[]
              for tok in toks:
                  if any(ch.isdigit() for ch in tok): continue
                  if re.search(r"[%/×x·^=<>~±µμ]",tok): continue
                  kept.append(tok)
              return re.sub(r"\s+"," ","".join(kept)).strip()

          records=[]
          receipts=[]
          for year in years:
              params={
                "query.title":query,
                "filter":f"from-pub-date:{year}-01-01,until-pub-date:{year}-12-31,type:journal-article",
                "select":"DOI,title,published,container-title,type",
                "rows":"1000"
              }
              url="https://api.crossref.org/works?"+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers={"User-Agent":"HTFI-source-census/1.2 (metadata-only research)"})
              payload=None
              attempts=[]
              for attempt in range(1,6):
                  try:
                      with urllib.request.urlopen(req,timeout=90) as resp:
                          payload=json.load(resp)
                      attempts.append({"attempt":attempt,"status":"success"})
                      break
                  except urllib.error.HTTPError as e:
                      attempts.append({"attempt":attempt,"status":f"http_{e.code}"})
                      if e.code!=429 or attempt==5: raise
                      time.sleep(5*attempt)
              items=payload.get("message",{}).get("items",[])
              receipts.append({"year":year,"items_returned":len(items),"attempts":attempts})
              for it in items:
                  doi=(it.get("DOI") or "").strip()
                  titles=it.get("title") or []
                  title=titles[0].strip() if titles else ""
                  venues=it.get("container-title") or []
                  venue=" | ".join(venues).strip()
                  if not doi or not title or not venue: continue
                  tl=title.lower()
                  if "ethylene" not in tl or "polymer" not in tl: continue
                  if not any(k in tl for k in catalyst_terms): continue
                  excluded=any(k in tl for k in exclusion)
                  records.append({
                    "year":year,
                    "doi":doi,
                    "venue":venue,
                    "title_sha256":hashlib.sha256(title.encode()).hexdigest(),
                    "title_redacted":redact_title(title),
                    "explicit_copolymer_signal":excluded,
                    "raw_title_retained":False,
                    "abstract_requested":False
                  })
              time.sleep(2)

          dedup={}
          for r in records:
              dedup[r["doi"].lower()]=r
          records=sorted(dedup.values(),key=lambda x:(x["year"],x["doi"]))
          by=defaultdict(lambda:{"records":0,"non_copolymer_title_records":0})
          for r in records:
              by[str(r["year"])]["records"]+=1
              by[str(r["year"])]["non_copolymer_title_records"]+=int(not r["explicit_copolymer_signal"])

          out={
            "schema":"HTFI-v32-FD44-blinded-metadata-census-v1",
            "candidate":"FD44",
            "performance_values_intentionally_extracted":False,
            "abstracts_requested":False,
            "raw_titles_retained":False,
            "required_years":years,
            "query_frozen_for_bridge":query,
            "records":records,
            "year_counts":dict(by),
            "metadata_source_family_continuity":all(by[str(y)]["records"]>0 for y in years),
            "non_copolymer_title_continuity":all(by[str(y)]["non_copolymer_title_records"]>0 for y in years),
            "scientific_limit":"Metadata-only census cannot establish frozen 60-90C, 5-20 bar, catalyst-mass-and-time productivity conditions. Those remain pending; this artifact cannot by itself promote FD44 to source-closed primary."
          }
          open("out/fd44_blinded_metadata_census.json","w").write(json.dumps(out,indent=2))
          open("out/request_receipts.json","w").write(json.dumps(receipts,indent=2))
          with open("out/SHA256SUMS.txt","w") as f:
              for p in ["out/fd44_blinded_metadata_census.json","out/request_receipts.json"]:
                  f.write(hashlib.sha256(open(p,"rb").read()).hexdigest()+"  "+p.split("/")[-1]+"\n")
          print("FD44 metadata-only census complete; no abstracts or performance values retained")
          PY
      - name: Upload blinded census
        uses: actions/upload-artifact@v4
        with:
          name: htfi-v32-fd44-blinded-metadata-census
          path: out/
          retention-days: 1
