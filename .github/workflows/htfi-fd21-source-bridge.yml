name: HTFI FD21 source bridge

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fetch-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch exact FFmpeg tags and pre-2012 public H264 clip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/ffmpeg
          curl -L --fail --retry 4 --connect-timeout 20 --max-time 300 \
            -o out/Fish_1080P_16M.264 \
            'https://samples.ffmpeg.org/archive/video/h264/h264+h264+++Fish_1080P_16M.264'
          sha256sum out/Fish_1080P_16M.264 > out/clip_sha256.txt
          stat -c '%s' out/Fish_1080P_16M.264 > out/clip_size.txt

          git clone -q --filter=blob:none --no-checkout https://github.com/FFmpeg/FFmpeg.git ffmpeg
          cat > out/releases.tsv <<'EOF'
          2012	n1.0.1
          2013	n2.0.3
          2014	n2.1.7
          2015	n2.6.6
          2018	n3.3.9
          2020	n4.3.1
          2025	n5.1.8
          EOF
          printf 'year\ttag\tcommit\tarchive_sha256\n' > out/source_manifest.tsv
          while IFS=$'\t' read -r year tag; do
            git -C ffmpeg fetch -q --depth 1 origin "refs/tags/${tag}:refs/tags/${tag}"
            commit="$(git -C ffmpeg rev-list -n 1 "$tag")"
            dst="out/ffmpeg/ffmpeg-${year}-${tag}.tar.gz"
            git -C ffmpeg archive --format=tar.gz -o "../$dst" "$tag"
            h="$(sha256sum "$dst"|awk '{print $1}')"
            printf '%s\t%s\t%s\t%s\n' "$year" "$tag" "$commit" "$h" >> out/source_manifest.tsv
          done < out/releases.tsv
          find out -type f -print0 | sort -z | xargs -0 sha256sum > out/ALL_SHA256SUMS.txt
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: htfi-fd21-sources-and-fixed-clip
          path: out/
          retention-days: 1
