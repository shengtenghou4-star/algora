name: HOU-LENS P4.6 exact attempt-2 payload publisher

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/hou-lens-p46-pr-trigger-v4.txt

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  recover-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_BRANCH: hou-lens-p4-5-scientific-payload
      PAYLOAD_DIR: .github/hou-lens-p4-5-scientific-payload
      P46_TRANSPORT_ISSUE: '11'
      EXPECTED_RUN_ID: '31024654733'
      EXPECTED_RUN_ATTEMPT: '2'
      EXPECTED_REPLICA: C
      EXPECTED_HEAD_SHA: c442ad926a8c22bf786d3a221398c59cfcb81c88
      EXPECTED_BLOCK_COUNT: '48'
      EXPECTED_B64_BYTES: '114472'
      EXPECTED_B64_SHA256: 8474aef3e7d78471f85d8cdacb16f4e12b5a438b2f8e88cd06642a79267c7fec
      EXPECTED_CMS_BYTES: '85854'
      EXPECTED_CMS_SHA256: 595c0aa2e7b8926d1fe0a404d869f11cb66d13864bba419c486223d37e1033b6
      EXPECTED_TAR_BYTES: '85184'
      EXPECTED_TAR_SHA256: a5613edffa230403a24e5c6d1d4bd6d81fbc2901295343f1b2f2cc9f87e8559e
      PART_BYTES: '28618'
      FRAGMENT_REPAIR_BLOCK: '-1'
    steps:
      - name: Checkout transport control from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: control
          persist-credentials: false

      - name: Checkout payload branch
        uses: actions/checkout@v4
        with:
          ref: hou-lens-p4-5-scientific-payload
          path: payload
          fetch-depth: 0

      - name: Recover and globally verify encrypted payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python control/scripts/hou_lens_p46_publish_transport.py
          test "$(wc -c </tmp/payload.b64)" = "$EXPECTED_B64_BYTES"
          test "$(sha256sum /tmp/payload.b64 | cut -d' ' -f1)" = "$EXPECTED_B64_SHA256"

      - name: Publish four parts before manifest
        working-directory: payload
        run: |
          set -euo pipefail
          git config user.name 'hou-lens-p46-transport-bot'
          git config user.email 'hou-lens-p46-transport-bot@users.noreply.github.com'
          rm -rf "$PAYLOAD_DIR"
          mkdir -p "$PAYLOAD_DIR"
          rm -f /tmp/formal-part-*
          split -b "$PART_BYTES" -d -a 3 /tmp/payload.b64 /tmp/formal-part-
          python - <<'PY'
          import os, pathlib
          size = int(os.environ['PART_BYTES'])
          parts = sorted(pathlib.Path('/tmp').glob('formal-part-*'))
          if len(parts) != 4 or any(path.stat().st_size != size for path in parts):
              raise SystemExit('formal four-part split mismatch')
          root = pathlib.Path(os.environ['PAYLOAD_DIR'])
          for index, path in enumerate(parts, 1):
              (root / f'part-{index:03d}.b64').write_bytes(path.read_bytes())
          PY
          git add -A "$PAYLOAD_DIR"
          git commit -m 'Publish run 31024654733 attempt 2 replica C payload parts'
          git push origin "HEAD:$TARGET_BRANCH"
          git fetch -q origin "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          python - <<'PY'
          import hashlib, os, pathlib, subprocess
          prefix = os.environ['PAYLOAD_DIR'] + '/'
          ref = 'refs/remotes/origin/' + os.environ['TARGET_BRANCH']
          names = subprocess.check_output(['git','ls-tree','-r','--name-only',ref,'--',os.environ['PAYLOAD_DIR']], text=True).splitlines()
          expected = [prefix + f'part-{i:03d}.b64' for i in range(1,5)]
          if sorted(names) != expected:
              raise SystemExit(f'parts-only remote file set mismatch: {names}')
          for name in expected:
              remote = subprocess.check_output(['git','show',f'{ref}:{name}'])
              local = pathlib.Path(name).read_bytes()
              if remote != local or hashlib.sha256(remote).hexdigest() != hashlib.sha256(local).hexdigest():
                  raise SystemExit(f'remote part mismatch: {name}')
          print('PASS_REMOTE_PARTS_ONLY')
          PY

      - name: Publish manifest last and verify final branch
        working-directory: payload
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['PAYLOAD_DIR'])
          parts = []
          for path in sorted(root.glob('part-*.b64')):
              raw = path.read_bytes()
              parts.append({
                  'file': path.name,
                  'bytes': len(raw),
                  'sha256': hashlib.sha256(raw).hexdigest(),
                  'git_blob': subprocess.check_output(['git','hash-object','--stdin'], input=raw).decode().strip(),
              })
          if len(parts) != 4 or sum(row['bytes'] for row in parts) != int(os.environ['EXPECTED_B64_BYTES']):
              raise SystemExit('manifest part-set mismatch')
          manifest = {
              'schema_version': 2,
              'protocol': 'HOU-LENS-P4.5-SINGLE-SCIENTIFIC-EXECUTION',
              'scientific_execution_payload': True,
              'run_id': os.environ['EXPECTED_RUN_ID'],
              'run_attempt': os.environ['EXPECTED_RUN_ATTEMPT'],
              'executor_head_sha': os.environ['EXPECTED_HEAD_SHA'],
              'payload_files': [
                  'P4_1_IMAGE_OBJECT_MANIFEST.csv',
                  'P4_1_ONE_USE_IMAGE_ACCESS_LOCK.json',
                  'P4_1_SODA_REQUEST_MANIFEST.csv',
                  'P4_5_CONTINUATION_CONSUMPTION_RECEIPT.json',
                  'P4_5_EXECUTION_BINDING.json',
                  'p4-5-result-recipient-cert.pem',
              ],
              'payload_tar_bytes': int(os.environ['EXPECTED_TAR_BYTES']),
              'payload_tar_sha256': os.environ['EXPECTED_TAR_SHA256'],
              'cms_der_bytes': int(os.environ['EXPECTED_CMS_BYTES']),
              'cms_der_sha256': os.environ['EXPECTED_CMS_SHA256'],
              'base64_bytes': int(os.environ['EXPECTED_B64_BYTES']),
              'base64_sha256': os.environ['EXPECTED_B64_SHA256'],
              'parts': parts,
          }
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          PY
          git add "$PAYLOAD_DIR/manifest.json"
          git commit -m 'Publish run 31024654733 attempt 2 replica C manifest last'
          git push origin "HEAD:$TARGET_BRANCH"
          git fetch -q origin "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          python - <<'PY'
          import hashlib, json, os, subprocess
          prefix = os.environ['PAYLOAD_DIR'] + '/'
          ref = 'refs/remotes/origin/' + os.environ['TARGET_BRANCH']
          names = subprocess.check_output(['git','ls-tree','-r','--name-only',ref,'--',os.environ['PAYLOAD_DIR']], text=True).splitlines()
          expected = [prefix + 'manifest.json'] + [prefix + f'part-{i:03d}.b64' for i in range(1,5)]
          if sorted(names) != sorted(expected):
              raise SystemExit(f'final remote file set mismatch: {names}')
          m = json.loads(subprocess.check_output(['git','show',f'{ref}:{prefix}manifest.json']))
          checks = [
              str(m.get('run_id')) == os.environ['EXPECTED_RUN_ID'],
              str(m.get('run_attempt')) == os.environ['EXPECTED_RUN_ATTEMPT'],
              m.get('executor_head_sha') == os.environ['EXPECTED_HEAD_SHA'],
              int(m.get('base64_bytes')) == int(os.environ['EXPECTED_B64_BYTES']),
              m.get('base64_sha256') == os.environ['EXPECTED_B64_SHA256'],
              int(m.get('cms_der_bytes')) == int(os.environ['EXPECTED_CMS_BYTES']),
              m.get('cms_der_sha256') == os.environ['EXPECTED_CMS_SHA256'],
              int(m.get('payload_tar_bytes')) == int(os.environ['EXPECTED_TAR_BYTES']),
              m.get('payload_tar_sha256') == os.environ['EXPECTED_TAR_SHA256'],
          ]
          if not all(checks):
              raise SystemExit('final remote manifest identity mismatch')
          assembled = b''.join(subprocess.check_output(['git','show',f"{ref}:{prefix}{row['file']}"]) for row in m['parts'])
          if len(assembled) != int(os.environ['EXPECTED_B64_BYTES']) or hashlib.sha256(assembled).hexdigest() != os.environ['EXPECTED_B64_SHA256']:
              raise SystemExit('final remote assembled payload mismatch')
          print('PASS_FINAL_REMOTE_PAYLOAD')
          PY
