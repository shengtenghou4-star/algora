name: HTFI Mendeley version consistency bridge

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fetch-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch V1/V2 small public files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python3 - <<'PY'
          import json,urllib.request,hashlib,pathlib
          out=pathlib.Path('out')
          headers={'Accept':'application/vnd.mendeley-public-dataset.1+json','User-Agent':'htfi-audit'}
          report={}
          for ver in (1,2):
              list_url=f'https://data.mendeley.com/public-api/datasets/f4fj887y67/files?folder_id=root&version={ver}'
              req=urllib.request.Request(list_url,headers=headers)
              with urllib.request.urlopen(req,timeout=60) as r: files=json.load(r)
              (out/f'v{ver}_root_files.json').write_text(json.dumps(files,indent=2))
              report[str(ver)]={}
              wanted=['performance_time_series.csv'] + (['PERFORMANCE_DOMAINS_K_Kr2.csv'] if ver==2 else [])
              for name in wanted:
                  hits=[x for x in files if x.get('filename')==name]
                  if len(hits)!=1:
                      report[str(ver)][name]={'target_count':len(hits)}; continue
                  m=hits[0]; url=m['content_details']['download_url']
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'htfi-audit'}),timeout=60) as r: b=r.read()
                  fn=f'v{ver}_{name}'
                  (out/fn).write_bytes(b)
                  report[str(ver)][name]={'id':m['id'],'metadata_sha256':m['content_details'].get('sha256_hash'),'downloaded_sha256':hashlib.sha256(b).hexdigest(),'size':len(b)}
          (out/'consistency_metadata.json').write_text(json.dumps(report,indent=2))
          PY
          python3 - <<'PY'
          import csv,json,pathlib,hashlib
          out=pathlib.Path('out'); summary={}
          for ver in (1,2):
              p=out/f'v{ver}_performance_time_series.csv'
              with p.open(newline='',encoding='utf-8-sig') as f: rows=list(csv.reader(f))
              body=rows[1:]; domains=sorted(set(x[3] for x in body))
              summary[f'v{ver}']={'rows':len(body),'domains':len(domains),'domain_names':domains,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          kp=out/'v2_PERFORMANCE_DOMAINS_K_Kr2.csv'
          with kp.open(newline='',encoding='utf-8-sig') as f: kr=list(csv.reader(f))
          summary['v2_K_table']={'data_rows':len(kr)-1,'header':kr[0],'sha256':hashlib.sha256(kp.read_bytes()).hexdigest()}
          (out/'consistency_summary.json').write_text(json.dumps(summary,indent=2))
          PY
          sha256sum out/* > out/SHA256SUMS.txt
      - name: Upload consistency artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: htfi-mendeley-version-consistency
          path: out/
          retention-days: 1
