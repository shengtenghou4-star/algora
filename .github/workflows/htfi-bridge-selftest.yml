name: HTFI Mendeley raw file bridge

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fetch-target:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch root file list and target raw CSV
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          LIST='https://data.mendeley.com/public-api/datasets/f4fj887y67/files?folder_id=root&version=2'
          curl -L -sS --fail -H 'Accept: application/vnd.mendeley-public-dataset.1+json' -o out/root_files.json "$LIST"
          python3 - <<'PY'
          from pathlib import Path
          import json
          x=json.loads(Path('out/root_files.json').read_text())
          if not isinstance(x,list): raise SystemExit(f'expected list, got {type(x)}')
          targets=[r for r in x if r.get('filename')=='performance_time_series.csv']
          Path('out/root_file_summary.json').write_text(json.dumps([{'id':r.get('id'),'filename':r.get('filename'),'status':r.get('status'),'folder_id':r.get('folder_id'),'content_details':r.get('content_details')} for r in x],indent=2),encoding='utf-8')
          if len(targets)!=1: raise SystemExit(f'target count={len(targets)}')
          r=targets[0]
          Path('out/target_metadata.json').write_text(json.dumps(r,indent=2),encoding='utf-8')
          Path('out/target_file_id.txt').write_text(str(r['id']))
          url=r.get('content_details',{}).get('download_url')
          if not url: raise SystemExit('target has no content_details.download_url')
          Path('out/target_download_url.txt').write_text(url)
          PY
          FILEID=$(cat out/target_file_id.txt)
          curl -L -sS --fail -H 'Accept: application/vnd.mendeley-public-dataset.1+json' -o out/target_file_metadata.json "https://data.mendeley.com/public-api/datasets/f4fj887y67/files/${FILEID}"
          URL=$(cat out/target_download_url.txt)
          curl -L -sS --fail --retry 3 -o out/performance_time_series_RAW.csv "$URL"
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          raw=Path('out/performance_time_series_RAW.csv')
          with raw.open(newline='',encoding='utf-8-sig') as f:
              r=csv.reader(f); rows=list(r)
          header=rows[0]; body=rows[1:]
          assert len(body)==398, len(body)
          assert header==['','Year','Data','Domain','Metric','Units'], header
          assert all(len(x)==6 for x in body)
          idx=[int(x[0]) for x in body]
          assert len(idx)==398 and len(set(idx))==398
          canonical=[x[1:] for x in body]
          domains=sorted(set(x[2] for x in canonical))
          assert len(domains)==30, len(domains)
          with open('out/performance_time_series.csv','w',newline='',encoding='utf-8') as f:
              w=csv.writer(f); w.writerow(['Year','Data','Domain','Metric','Units']); w.writerows(canonical)
          counts={d:sum(1 for x in canonical if x[2]==d) for d in domains}
          Path('out/domain_counts.json').write_text(json.dumps(counts,indent=2),encoding='utf-8')
          Path('out/validation.json').write_text(json.dumps({'raw_rows':398,'raw_header':header,'raw_index_integer_unique':True,'raw_index_min':min(idx),'raw_index_max':max(idx),'canonical_columns':['Year','Data','Domain','Metric','Units'],'domains':30},indent=2),encoding='utf-8')
          print('VALIDATED raw=398 canonical=398 domains=30 index_unique=398')
          PY
          sha256sum out/* > out/SHA256SUMS.txt
          ls -lh out > out/LISTING.txt
      - name: Upload raw target artifact
        uses: actions/upload-artifact@v4
        with:
          name: htfi-performance-time-series-raw
          path: out/
          retention-days: 1
