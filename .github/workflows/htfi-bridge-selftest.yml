name: HTFI Mendeley frontend probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch dataset page and JS bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          curl -L -sS --fail -o out/page.html https://data.mendeley.com/datasets/f4fj887y67/2
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, urllib.parse, json
          html=Path('out/page.html').read_text(errors='ignore')
          srcs=re.findall(r'<script[^>]+src=["\']([^"\']+)',html)
          urls=[]
          for s in srcs:
              u=urllib.parse.urljoin('https://data.mendeley.com/datasets/f4fj887y67/2',s)
              if 'mendeley' in u or u.startswith('https://data.mendeley.com'):
                  urls.append(u)
          Path('out/script_urls.json').write_text(json.dumps(urls,indent=2))
          for i,u in enumerate(urls):
              p=f'out/script_{i:02d}.js'
              subprocess.run(['curl','-L','-sS','--fail','-o',p,u],check=False)
          PY

          python3 - <<'PY'
          from pathlib import Path
          import re,json
          pats=['filesLoading','file_downloaded','public-files','api.data.mendeley','dataset-files','/files','downloadUrl','download_url','fileId','file_id','digitalcommonsdata','oauth','bearer','authorization']
          hits=[]
          for p in sorted(Path('out').glob('script_*.js')):
              s=p.read_text(errors='ignore')
              rec={'file':p.name,'bytes':p.stat().st_size,'hits':{}}
              for pat in pats:
                  locs=[m.start() for m in re.finditer(re.escape(pat),s,re.I)]
                  if locs:
                      rec['hits'][pat]=[s[max(0,x-1200):x+2200] for x in locs[:12]]
              urls=sorted(set(re.findall(r'https?://[^\"\'<>\\s)]+',s)))
              urls=[u for u in urls if any(k in u.lower() for k in ['mendeley','digitalcommons','dataset','file'])]
              if urls: rec['candidate_urls']=urls[:500]
              if rec['hits'] or rec.get('candidate_urls'): hits.append(rec)
          Path('out/frontend_hits.json').write_text(json.dumps(hits,indent=2),encoding='utf-8')
          PY
          sha256sum out/* > out/SHA256SUMS.txt
          ls -lh out > out/LISTING.txt
      - name: Upload frontend probe
        uses: actions/upload-artifact@v4
        with:
          name: htfi-mendeley-frontend-probe
          path: out/
          retention-days: 1
