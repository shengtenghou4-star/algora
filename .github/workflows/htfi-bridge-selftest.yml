name: HTFI Mendeley raw file bridge

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fetch-target:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch root file list and target raw CSV
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          LIST='https://data.mendeley.com/public-api/datasets/f4fj887y67/files?folder_id=root&version=2'
          curl -L -sS --fail -H 'Accept: application/vnd.mendeley-public-dataset.1+json' -o out/root_files.json "$LIST"
          python3 - <<'PY'
          from pathlib import Path
          import json,sys
          x=json.loads(Path('out/root_files.json').read_text())
          if not isinstance(x,list):
              raise SystemExit(f'expected list, got {type(x)}: {str(x)[:500]}')
          targets=[r for r in x if r.get('filename')=='performance_time_series.csv']
          Path('out/root_file_summary.json').write_text(json.dumps([{'id':r.get('id'),'filename':r.get('filename'),'status':r.get('status'),'folder_id':r.get('folder_id'),'content_details':r.get('content_details')} for r in x],indent=2),encoding='utf-8')
          if len(targets)!=1:
              raise SystemExit(f'target count={len(targets)}; names={[r.get("filename") for r in x]}')
          r=targets[0]
          Path('out/target_metadata.json').write_text(json.dumps(r,indent=2),encoding='utf-8')
          Path('out/target_file_id.txt').write_text(str(r['id']))
          url=r.get('content_details',{}).get('download_url')
          if not url: raise SystemExit('target has no content_details.download_url')
          Path('out/target_download_url.txt').write_text(url)
          PY
          FILEID=$(cat out/target_file_id.txt)
          curl -L -sS --fail -H 'Accept: application/vnd.mendeley-public-dataset.1+json' \
            -o out/target_file_metadata.json \
            "https://data.mendeley.com/public-api/datasets/f4fj887y67/files/${FILEID}"
          URL=$(cat out/target_download_url.txt)
          curl -L -sS --fail --retry 3 -o out/performance_time_series.csv "$URL"
          python3 - <<'PY'
          import pandas as pd
          p='out/performance_time_series.csv'
          d=pd.read_csv(p)
          assert len(d)==398, len(d)
          assert d['Domain'].nunique()==30, d['Domain'].nunique()
          assert list(d.columns)==['Year','Data','Domain','Metric','Units'], list(d.columns)
          d.groupby('Domain').size().rename('n').to_csv('out/domain_counts.csv')
          print('VALIDATED',len(d),d.Domain.nunique(),list(d.columns))
          PY
          sha256sum out/* > out/SHA256SUMS.txt
          ls -lh out > out/LISTING.txt
      - name: Upload raw target artifact
        uses: actions/upload-artifact@v4
        with:
          name: htfi-performance-time-series-raw
          path: out/
          retention-days: 1
