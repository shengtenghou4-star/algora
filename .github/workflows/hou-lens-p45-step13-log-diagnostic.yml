name: HOU-LENS P4.5 step13 log diagnostic

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/hou-lens-p45-step13-log-trigger.txt

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download exact failed job log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/shengtenghou4-star/algora/actions/jobs/92555051649/logs' \
            -o /tmp/job.log
          test -s /tmp/job.log
          file /tmp/job.log
          wc -c /tmp/job.log

      - name: Build broad text index
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, re, zipfile
          path=pathlib.Path('/tmp/job.log')
          texts=[]
          if zipfile.is_zipfile(path):
              with zipfile.ZipFile(path) as zf:
                  for name in zf.namelist():
                      if not name.endswith('/'):
                          texts.append((name,zf.read(name).decode('utf-8','replace')))
          else:
              texts=[('job.log',path.read_text(errors='replace'))]
          terms=('independent-audit','private-result.tar.gz','result.cms.der','openssl cms','split -b','rm -rf','Process completed with exit code','##[error]','Traceback','Permission denied','No such file','PASS_INDEPENDENT_PRIVATE_BYTE_AUDIT')
          hits=[]
          tails={}
          for name,text in texts:
              lines=text.splitlines()
              tails[name]=lines[-250:]
              for i,line in enumerate(lines):
                  if any(term.lower() in line.lower() for term in terms):
                      hits.append({'file':name,'line_number':i+1,'line':line})
          result={'schema_version':2,'job_id':92555051649,'run_id':31024654733,'archive_members':[n for n,_ in texts],'hits':hits,'tails':tails}
          pathlib.Path('/tmp/step13-diagnostic.json').write_text(json.dumps(result,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps({'archive_members':result['archive_members'],'hit_count':len(hits),'last_hits':hits[-30:]},indent=2,ensure_ascii=False))
          PY

      - name: Upload raw log and index
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hou-lens-p45-step13-log-diagnostic-${{ github.run_id }}
          path: |
            /tmp/job.log
            /tmp/step13-diagnostic.json
          retention-days: 3
          if-no-files-found: warn
