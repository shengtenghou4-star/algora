name: HOU-LENS P4.5 exact runtime recovery patcher

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/hou-lens-p45-runtime-recovery-trigger.txt

permissions:
  contents: write

jobs:
  patch-scientific-workflow:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout patch control from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: control
          persist-credentials: false

      - name: Checkout scientific execution branch
        uses: actions/checkout@v4
        with:
          ref: hou-lens-p4-5-single-execution
          path: target
          fetch-depth: 0

      - name: Apply and validate exact runtime recovery patch
        run: |
          set -euo pipefail
          python control/scripts/hou_lens_p45_patch_runtime_recovery.py \
            target/.github/workflows/hou-lens-p4-5-single-scientific-execution.yml
          git -C target diff --check
          grep -F 'PASS_RESTORED_ORIGINAL_FROZEN_WHEEL_IDENTITY' \
            target/.github/workflows/hou-lens-p4-5-single-scientific-execution.yml
          grep -F '2b93e842ba98db65bef6a1073e073a55e694741de7ecd47878a6b949288eb8f1' \
            target/.github/workflows/hou-lens-p4-5-single-scientific-execution.yml

      - name: Upload patched scientific workflow
        uses: actions/upload-artifact@v4
        with:
          name: hou-lens-p45-patched-scientific-workflow-${{ github.run_id }}
          path: target/.github/workflows/hou-lens-p4-5-single-scientific-execution.yml
          retention-days: 2
          compression-level: 0
          if-no-files-found: error

      - name: Stage validated workflow blob on scientific branch
        working-directory: target
        run: |
          set -euo pipefail
          mkdir -p staged/hou-lens-p45-runtime-recovery
          cp .github/workflows/hou-lens-p4-5-single-scientific-execution.yml \
            staged/hou-lens-p45-runtime-recovery/hou-lens-p4-5-single-scientific-execution.yml
          git checkout -- .github/workflows/hou-lens-p4-5-single-scientific-execution.yml
          test -z "$(git diff --name-only -- .github/workflows/hou-lens-p4-5-single-scientific-execution.yml)"
          git config user.name 'hou-lens-runtime-recovery-bot'
          git config user.email 'hou-lens-runtime-recovery-bot@users.noreply.github.com'
          git add staged/hou-lens-p45-runtime-recovery/hou-lens-p4-5-single-scientific-execution.yml
          git commit -m 'Stage validated exact P4.5 runtime recovery workflow blob'
          git push origin HEAD:hou-lens-p4-5-single-execution
