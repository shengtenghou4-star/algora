name: HOU-LENS isolated encrypted ESO executor

on:
  push:
    branches:
      - hou-lens-p4-executor-canary
    paths:
      - .github/workflows/hou-lens-p4-executor-canary.yml
      - .hou-lens-p4-canary-trigger
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/hou-lens-p4-executor-canary.yml
      - .hou-lens-p4-canary-trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  encrypted-executor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Generate ephemeral executor certificate
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p private handshake inbox public
          openssl req -x509 -newkey rsa:3072 -nodes \
            -keyout private/executor-key.pem \
            -out handshake/executor-cert.pem \
            -days 1 \
            -subj "/CN=hou-lens-p4-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            >/dev/null 2>&1
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          cert = Path('handshake/executor-cert.pem').read_bytes()
          receipt = {
              'schema_version': 1,
              'stage': 'hou_lens_p4_ephemeral_executor_handshake',
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'head_sha': os.environ['GITHUB_SHA'],
              'executor_cert_sha256': hashlib.sha256(cert).hexdigest(),
              'private_key_exported': False,
              'contains_p4_identity': False,
          }
          Path('handshake/handshake_receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n'
          )
          PY

      - name: Upload ephemeral public certificate
        uses: actions/upload-artifact@v4
        with:
          name: hou-lens-p4-handshake-${{ github.run_id }}-${{ github.run_attempt }}
          path: handshake
          if-no-files-found: error
          retention-days: 1

      - name: Wait for run-bound multipart encrypted payload
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          root="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${branch}/.hou-lens-p4-executor/${GITHUB_RUN_ID}"
          found=false
          for i in $(seq 1 240); do
            if curl --fail --silent --show-error --location \
              --max-time 30 "${root}/payload.manifest.json?nonce=${i}" \
              -o inbox/payload.manifest.json; then
              found=true
              break
            fi
            sleep 5
          done
          test "$found" = true
          python - <<'PY'
          import json, os
          from pathlib import Path
          m = json.loads(Path('inbox/payload.manifest.json').read_text())
          if str(m['run_id']) != os.environ['GITHUB_RUN_ID']:
              raise SystemExit('multipart payload run ID mismatch')
          count = int(m['chunk_count'])
          if count < 1 or count > 64:
              raise SystemExit('invalid payload chunk count')
          Path('inbox/chunk_count.txt').write_text(str(count))
          PY
          : > inbox/payload.cms.b64
          count=$(cat inbox/chunk_count.txt)
          for index in $(seq 0 $((count - 1))); do
            name=$(printf 'chunk-%03d.b64' "$index")
            curl --fail --silent --show-error --location --max-time 60 \
              "${root}/${name}?nonce=${GITHUB_RUN_ATTEMPT}-${index}" \
              -o "inbox/${name}"
            cat "inbox/${name}" >> inbox/payload.cms.b64
          done
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          m = json.loads(Path('inbox/payload.manifest.json').read_text())
          b64 = Path('inbox/payload.cms.b64').read_bytes()
          if hashlib.sha256(b64).hexdigest() != m['payload_b64_sha256']:
              raise SystemExit('multipart Base64 hash mismatch')
          PY
          base64 --decode inbox/payload.cms.b64 > inbox/payload.cms
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          m = json.loads(Path('inbox/payload.manifest.json').read_text())
          cms = Path('inbox/payload.cms').read_bytes()
          if hashlib.sha256(cms).hexdigest() != m['payload_cms_sha256']:
              raise SystemExit('multipart CMS hash mismatch')
          PY

      - name: Decrypt and validate private payload
        shell: bash
        run: |
          set -euo pipefail
          openssl cms -decrypt -binary -inform DER \
            -in inbox/payload.cms \
            -recip handshake/executor-cert.pem \
            -inkey private/executor-key.pem \
            -out private/payload.tar.gz
          mkdir -p private/payload
          tar -xzf private/payload.tar.gz -C private/payload
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          manifest = json.loads(Path('private/payload/payload_manifest.json').read_text())
          if str(manifest['run_id']) != os.environ['GITHUB_RUN_ID']:
              raise SystemExit('payload run ID mismatch')
          expected = {
              'source_bound_plan.json': '03d225498c0705f1cf4f4ab63fe3672a5309d777ed53d73c089a20c9a3c34cb1',
              'runner.py': manifest['runner_sha256'],
              'result-recipient-cert.pem': manifest['result_recipient_cert_sha256'],
          }
          for name, wanted in expected.items():
              data = Path('private/payload', name).read_bytes()
              if hashlib.sha256(data).hexdigest() != wanted:
                  raise SystemExit(f'payload hash mismatch: {name}')
          if manifest.get('contains_images') or manifest.get('contains_scores'):
              raise SystemExit('forbidden payload content')
          PY

      - name: Execute 48 encrypted catalogue queries
        id: execute
        shell: bash
        run: |
          set +e
          python private/payload/runner.py \
            --plan private/payload/source_bound_plan.json \
            --output-dir private/results \
            --timeout 240 \
            --attempts 3
          rc=$?
          echo "runner_rc=${rc}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Encrypt private result package
        if: always()
        shell: bash
        env:
          RUNNER_RC: ${{ steps.execute.outputs.runner_rc }}
        run: |
          set -euo pipefail
          mkdir -p private/results public
          if [ ! -f private/results/execution_receipt_public.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          Path('private/results/execution_receipt_public.json').write_text(
              json.dumps({
                  'schema_version': 1,
                  'stage': 'p4_encrypted_public_runner_public_receipt',
                  'status': 'EXECUTOR_FAILED_BEFORE_RECEIPT',
                  'planned_groups': 48,
                  'completed_groups': 0,
                  'failed_groups': 48,
                  'images_downloaded': False,
                  'scores_computed': False,
                  'unknown_dr5_only_targets_queried': False,
                  'blind_search_performed': False,
              }, indent=2, sort_keys=True) + '\n'
          )
          PY
          fi
          cp private/results/execution_receipt_public.json public/execution_receipt_public.json
          tar --sort=name --mtime='UTC 2026-08-01' --owner=0 --group=0 --numeric-owner \
            -czf private/results.tar.gz -C private results
          openssl cms -encrypt -binary -aes256 \
            -in private/results.tar.gz \
            -out public/result.cms \
            -outform DER \
            private/payload/result-recipient-cert.pem
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          encrypted = Path('public/result.cms').read_bytes()
          public_receipt = json.loads(Path('public/execution_receipt_public.json').read_text())
          envelope = {
              'schema_version': 1,
              'stage': 'hou_lens_p4_encrypted_result_envelope',
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'head_sha': os.environ['GITHUB_SHA'],
              'runner_rc': int(os.environ.get('RUNNER_RC') or -1),
              'execution_status': public_receipt.get('status'),
              'completed_groups': public_receipt.get('completed_groups', 0),
              'failed_groups': public_receipt.get('failed_groups', 48),
              'encrypted_result_bytes': len(encrypted),
              'encrypted_result_sha256': hashlib.sha256(encrypted).hexdigest(),
              'plaintext_result_uploaded': False,
              'images_downloaded': False,
              'scores_computed': False,
              'unknown_dr5_only_targets_queried': False,
              'blind_search_performed': False,
          }
          Path('public/envelope_receipt.json').write_text(
              json.dumps(envelope, indent=2, sort_keys=True) + '\n'
          )
          PY

      - name: Upload encrypted execution result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hou-lens-p4-encrypted-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: public
          if-no-files-found: error
          retention-days: 2

      - name: Enforce complete execution
        if: always()
        shell: bash
        env:
          RUNNER_RC: ${{ steps.execute.outputs.runner_rc }}
        run: |
          test "${RUNNER_RC:-99}" = '0'
