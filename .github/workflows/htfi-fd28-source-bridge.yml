name: HTFI FD28 source bridge

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fetch-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch fixed libevent and exact Memcached sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/memcached

          git clone -q --depth 1 --branch release-2.1.12-stable https://github.com/libevent/libevent.git libevent
          git -C libevent rev-parse HEAD > out/libevent_commit.txt
          git -C libevent archive --format=tar.gz -o ../out/libevent-2.1.12-stable.tar.gz HEAD

          git clone -q --filter=blob:none --no-checkout https://github.com/memcached/memcached.git memcached
          cat > out/releases.tsv <<'EOF'
          2012	1.4.15
          2013	1.4.17
          2014	1.4.22
          2015	1.4.25
          2018	1.5.12
          2020	1.6.9
          2025	1.6.40
          EOF
          printf 'year\ttag\tcommit\tarchive_sha256\n' > out/source_manifest.tsv
          while IFS=$'\t' read -r year tag; do
            git -C memcached fetch -q --depth 1 origin "refs/tags/${tag}:refs/tags/${tag}"
            commit="$(git -C memcached rev-list -n 1 "$tag")"
            dst="out/memcached/memcached-${year}-${tag}.tar.gz"
            git -C memcached archive --format=tar.gz -o "../$dst" "$tag"
            h="$(sha256sum "$dst" | awk '{print $1}')"
            printf '%s\t%s\t%s\t%s\n' "$year" "$tag" "$commit" "$h" >> out/source_manifest.tsv
          done < out/releases.tsv
          sha256sum out/libevent-2.1.12-stable.tar.gz > out/libevent_sha256.txt
          find out -type f -print0 | sort -z | xargs -0 sha256sum > out/ALL_SHA256SUMS.txt
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: htfi-fd28-fixed-dependency-and-sources
          path: out/
          retention-days: 1
