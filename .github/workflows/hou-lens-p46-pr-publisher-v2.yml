name: HOU-LENS P4.6 PR transport publisher v2

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/hou-lens-p46-pr-trigger-v2.txt

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  recover-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_BRANCH: hou-lens-p4-5-scientific-payload
      PAYLOAD_DIR: .github/hou-lens-p4-5-scientific-payload
      P46_TRANSPORT_ISSUE: '11'
      EXPECTED_RUN_ID: '31007861910'
      EXPECTED_RUN_ATTEMPT: '1'
      EXPECTED_REPLICA: B
      EXPECTED_HEAD_SHA: d848867710b63213886f5f368af6e9569c410d33
      EXPECTED_BLOCK_COUNT: '28'
      EXPECTED_B64_BYTES: '116272'
      EXPECTED_B64_SHA256: d86eebb2bff6174bcba0a02bc2430e3e0508fbabd59a38849c89ecb6188a708a
      EXPECTED_CMS_BYTES: '87202'
      EXPECTED_CMS_SHA256: 711b0a8b8d2d450801c9039210b7e8954aac0c1e47c61122ba15d2305670d67c
      EXPECTED_TAR_BYTES: '86528'
      EXPECTED_TAR_SHA256: 947a583f0fa59733dcdf55ece09d27e542fef8cc04970fcde024e7f6c24bd289
      PART_BYTES: '29068'
    steps:
      - name: Checkout transport control from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: control
          persist-credentials: false

      - name: Checkout payload branch for atomic publication
        uses: actions/checkout@v4
        with:
          ref: hou-lens-p4-5-scientific-payload
          path: payload
          fetch-depth: 0

      - name: Recover and verify encrypted payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: python control/scripts/hou_lens_p46_publish_transport.py

      - name: Publish four encrypted parts without manifest
        working-directory: payload
        run: |
          set -euo pipefail
          git config user.name 'hou-lens-p46-transport-bot'
          git config user.email 'hou-lens-p46-transport-bot@users.noreply.github.com'
          rm -rf "$PAYLOAD_DIR"
          mkdir -p "$PAYLOAD_DIR"
          split -b "$PART_BYTES" -d -a 3 /tmp/payload.b64 /tmp/formal-part-
          python - <<'PY'
          import os, pathlib
          size = int(os.environ['PART_BYTES'])
          parts = sorted(pathlib.Path('/tmp').glob('formal-part-*'))
          if len(parts) != 4 or any(path.stat().st_size != size for path in parts):
              raise SystemExit('formal four-part split mismatch')
          root = pathlib.Path('.github/hou-lens-p4-5-scientific-payload')
          for index, path in enumerate(parts, 1):
              (root / f'part-{index:03d}.b64').write_bytes(path.read_bytes())
          PY
          git add -A "$PAYLOAD_DIR"
          git commit -m 'Publish run 31007861910 attempt 1 replica B payload parts'
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Publish manifest as final commit
        working-directory: payload
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['PAYLOAD_DIR'])
          parts = []
          for path in sorted(root.glob('part-*.b64')):
              raw = path.read_bytes()
              parts.append({
                  'file': path.name,
                  'bytes': len(raw),
                  'sha256': hashlib.sha256(raw).hexdigest(),
                  'git_blob': subprocess.check_output(['git', 'hash-object', '--stdin'], input=raw).decode().strip(),
              })
          if len(parts) != 4 or sum(row['bytes'] for row in parts) != int(os.environ['EXPECTED_B64_BYTES']):
              raise SystemExit('manifest part-set mismatch')
          manifest = {
              'schema_version': 2,
              'protocol': 'HOU-LENS-P4.5-SINGLE-SCIENTIFIC-EXECUTION',
              'scientific_execution_payload': True,
              'run_id': os.environ['EXPECTED_RUN_ID'],
              'run_attempt': os.environ['EXPECTED_RUN_ATTEMPT'],
              'executor_head_sha': os.environ['EXPECTED_HEAD_SHA'],
              'payload_files': [
                  'P4_1_IMAGE_OBJECT_MANIFEST.csv',
                  'P4_1_ONE_USE_IMAGE_ACCESS_LOCK.json',
                  'P4_1_SODA_REQUEST_MANIFEST.csv',
                  'P4_5_CONTINUATION_CONSUMPTION_RECEIPT.json',
                  'P4_5_EXECUTION_BINDING.json',
                  'p4-5-result-recipient-cert.pem',
              ],
              'payload_tar_bytes': int(os.environ['EXPECTED_TAR_BYTES']),
              'payload_tar_sha256': os.environ['EXPECTED_TAR_SHA256'],
              'cms_der_bytes': int(os.environ['EXPECTED_CMS_BYTES']),
              'cms_der_sha256': os.environ['EXPECTED_CMS_SHA256'],
              'base64_bytes': int(os.environ['EXPECTED_B64_BYTES']),
              'base64_sha256': os.environ['EXPECTED_B64_SHA256'],
              'parts': parts,
          }
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          PY
          git add "$PAYLOAD_DIR/manifest.json"
          git commit -m 'Publish run 31007861910 attempt 1 replica B manifest last'
          git push origin "HEAD:$TARGET_BRANCH"
