name: HOU-LENS encrypted P4.3 one-use image acquisition

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/hou-lens-p4-3-encrypted-image-acquisition.yml

permissions:
  contents: read
  actions: read

jobs:
  acquisition:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Generate ephemeral P4.3 acquisition certificate
        run: |
          set -euo pipefail
          openssl req -x509 -newkey rsa:3072 -nodes -days 1 \
            -subj '/CN=HOU-LENS-P4.3-one-use-acquisition' \
            -keyout /tmp/runner.key -out runner.crt >/dev/null 2>&1
          python - <<'PY'
          import hashlib,json,os
          raw=open('runner.crt','rb').read()
          json.dump({
            'schema_version':1,
            'stage':'p4_3_one_use_acquisition_handshake',
            'run_id':os.environ['GITHUB_RUN_ID'],
            'head_sha':os.environ['GITHUB_SHA'],
            'certificate_sha256':hashlib.sha256(raw).hexdigest(),
            'private_key_published':False,
            'payload_released':False,
            'soda_requests_sent':0,
            'image_bytes_downloaded':0,
            'scores_computed':False,
          },open('handshake.json','w'),indent=2)
          PY

      - name: Upload P4.3 acquisition handshake
        uses: actions/upload-artifact@v4
        with:
          name: hou-lens-p4-3-acquisition-handshake-${{ github.run_id }}
          path: |
            runner.crt
            handshake.json
          retention-days: 2

      - name: Download frozen offline runtime
        uses: actions/download-artifact@v4
        with:
          name: hou-lens-p4-1-runtime-30734422166
          path: /tmp/runtime
          repository: shengtenghou4-star/algora
          run-id: 30734422166
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for atomic P4.3 encrypted payload
        env:
          BRANCH: ${{ github.head_ref }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/work /tmp/result /tmp/encrypted
          found=0
          for attempt in $(seq 1 1800); do
            git fetch -q origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            PAYLOAD_REF="refs/remotes/origin/$BRANCH"
            if git show "$PAYLOAD_REF:.github/hou-lens-p4-3-acquisition-payload/manifest.json" >/tmp/manifest.json 2>/dev/null; then
              run_id=$(python -c "import json; print(json.load(open('/tmp/manifest.json'))['run_id'])")
              if [ "$run_id" = "$EXPECTED_RUN_ID" ]; then
                count=$(python -c "import json; print(json.load(open('/tmp/manifest.json'))['part_count'])")
                complete=1
                : >/tmp/payload.b64
                for idx in $(seq -f '%03g' 1 "$count"); do
                  if ! git show "$PAYLOAD_REF:.github/hou-lens-p4-3-acquisition-payload/part-${idx}.b64" >>/tmp/payload.b64 2>/dev/null; then
                    complete=0
                    break
                  fi
                done
                if [ "$complete" = 1 ]; then found=1; break; fi
              fi
            fi
            sleep 10
          done
          test "$found" = 1
          python - <<'PY'
          import base64,hashlib,json,os
          m=json.load(open('/tmp/manifest.json'))
          if str(m['run_id']) != os.environ['EXPECTED_RUN_ID']: raise SystemExit('stale run id')
          b64=open('/tmp/payload.b64','rb').read()
          if len(b64)!=int(m['base64_bytes']): raise SystemExit('base64 byte count mismatch')
          if hashlib.sha256(b64).hexdigest()!=m['base64_sha256']: raise SystemExit('base64 hash mismatch')
          der=base64.b64decode(b64,validate=True)
          if hashlib.sha256(der).hexdigest()!=m['cms_der_sha256']: raise SystemExit('CMS hash mismatch')
          open('/tmp/payload.der','wb').write(der)
          PY
          openssl cms -decrypt -binary -inform DER -in /tmp/payload.der \
            -recip runner.crt -inkey /tmp/runner.key -out /tmp/payload.tar.gz
          python - <<'PY'
          import hashlib,json
          m=json.load(open('/tmp/manifest.json'))
          raw=open('/tmp/payload.tar.gz','rb').read()
          if hashlib.sha256(raw).hexdigest()!=m['payload_tar_sha256']: raise SystemExit('payload tar hash mismatch')
          PY
          tar -xzf /tmp/payload.tar.gz -C /tmp/work

      - name: Verify P4.3 receipt and frozen inputs before SODA
        run: |
          set -euo pipefail
          python /tmp/work/verify_acquisition_inputs.py \
            --work /tmp/work --runtime /tmp/runtime \
            --run-id "$GITHUB_RUN_ID" --job-id "$GITHUB_JOB" \
            --runner-cert runner.crt --output /tmp/result/input-verification.json
          IMAGE='python@sha256:86adf8dbadc3d6e82ee5dd2c74bec2e1c2467cdad47886280501df722372d2e1'
          docker pull "$IMAGE" >/dev/null
          docker run --rm --network none \
            -v /tmp/work:/work:ro -v /tmp/runtime:/runtime:ro \
            "$IMAGE" sh -lc '
              set -eu
              python -m pip install --disable-pip-version-check --no-index \
                --find-links /runtime/wheels -r /runtime/requirements.in >/dev/null
              export PYTHONPYCACHEPREFIX=/tmp/pycache
              cd /work
              PYTHONPATH=src python -m py_compile scripts/v3_execute_p4_1_locked_images.py
              PYTHONPATH=src pytest -q -p no:cacheprovider \
                tests/test_p4_image_acquisition.py tests/test_p4_soda_manifest.py
            '

      - name: Execute exactly 940 frozen SODA requests once
        run: |
          set -euo pipefail
          IMAGE='python@sha256:86adf8dbadc3d6e82ee5dd2c74bec2e1c2467cdad47886280501df722372d2e1'
          docker run --rm \
            -e GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            -v /tmp/work:/work:ro -v /tmp/runtime:/runtime:ro -v /tmp/result:/result \
            "$IMAGE" sh -lc '
              set -eu
              python -m pip install --disable-pip-version-check --no-index \
                --find-links /runtime/wheels -r /runtime/requirements.in >/dev/null
              cd /work
              PYTHONPATH=src python scripts/v3_execute_p4_1_locked_images.py \
                --lock P4_1_ONE_USE_IMAGE_ACCESS_LOCK.json \
                --objects P4_1_IMAGE_OBJECT_MANIFEST.csv \
                --requests P4_1_SODA_REQUEST_MANIFEST.csv \
                --consumption P4_3_ONE_USE_CONSUMPTION_RECEIPT.json \
                --output-dir /result/acquisition \
                --workers 4 --timeout-seconds 180 --max-attempts 3
            '

      - name: Independently audit score-opaque result
        run: |
          set -euo pipefail
          IMAGE='python@sha256:86adf8dbadc3d6e82ee5dd2c74bec2e1c2467cdad47886280501df722372d2e1'
          docker run --rm --network none \
            -e GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            -v /tmp/work:/work:ro -v /tmp/runtime:/runtime:ro -v /tmp/result:/result \
            "$IMAGE" sh -lc '
              set -eu
              python -m pip install --disable-pip-version-check --no-index \
                --find-links /runtime/wheels -r /runtime/requirements.in >/dev/null
              cd /work
              PYTHONPATH=src python audit_acquisition_result.py \
                --work /work --result /result/acquisition \
                --output /result/independent-audit.json
            '

      - name: Encrypt private image evidence into eight chunks
        run: |
          set -euo pipefail
          python /tmp/work/package_encrypted_acquisition.py \
            --result /tmp/result --recipient /tmp/work/result_recipient.crt \
            --output /tmp/encrypted --run-id "$GITHUB_RUN_ID"
          cat /tmp/encrypted/public-acquisition-summary.json

      - name: Upload encrypted P4.3 acquisition result
        uses: actions/upload-artifact@v4
        with:
          name: hou-lens-p4-3-acquisition-result-${{ github.run_id }}
          path: /tmp/encrypted/*
          retention-days: 3
          compression-level: 0
