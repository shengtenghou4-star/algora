name: HOU-LENS P4.5 single scientific execution

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/hou-lens-p4-5-single-scientific-execution.yml

permissions:
  contents: read
  actions: read

jobs:
  acquisition:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PAYLOAD_BRANCH: hou-lens-p4-5-scientific-payload
      PAYLOAD_DIR: .github/hou-lens-p4-5-scientific-payload
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Generate ephemeral P4.5 runner certificate
        run: |
          set -euo pipefail
          openssl req -x509 -newkey rsa:3072 -nodes -days 1 \
            -subj '/CN=HOU-LENS-P4.5-single-scientific-execution' \
            -keyout /tmp/runner.key -out runner.crt >/dev/null 2>&1
          python - <<'PY'
          import hashlib, json, os
          raw = open('runner.crt', 'rb').read()
          receipt = {
              'schema_version': 1,
              'stage': 'p4_5_single_scientific_execution_handshake',
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'executor_head_sha': os.environ['EXPECTED_HEAD_SHA'],
              'certificate_sha256': hashlib.sha256(raw).hexdigest(),
              'private_key_published': False,
              'payload_released': False,
              'soda_requests_sent': 0,
              'image_bytes_downloaded': 0,
              'scores_computed': False,
          }
          open('handshake.json', 'w').write(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          PY

      - name: Upload P4.5 execution handshake
        uses: actions/upload-artifact@v4
        with:
          name: hou-lens-p4-5-execution-handshake-${{ github.run_id }}
          path: |
            runner.crt
            handshake.json
          retention-days: 2

      - name: Download frozen base runtime
        uses: actions/download-artifact@v4
        with:
          name: hou-lens-p4-1-runtime-30734422166
          path: /tmp/runtime
          repository: shengtenghou4-star/algora
          run-id: 30734422166
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download frozen Requests runtime patch
        uses: actions/download-artifact@v4
        with:
          name: hou-lens-p4-5-requests-runtime-patch-30808837306
          path: /tmp/patch-artifact
          repository: shengtenghou4-star/algora
          run-id: 30808837306
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore original frozen base runtime after artifact expiry
        run: |
          set -euo pipefail
          mkdir -p /tmp/result
          test "$(sha256sum /tmp/runtime/requirements.in | cut -d' ' -f1)" = '525c2473112c887e2be57fdb6d7f048b32c30dabf6fe3e118991fa8fe7838ee1'
          rm -f /tmp/runtime/wheels/astropy_iers_data-*.whl /tmp/runtime/wheels/packaging-*.whl
          curl --fail --location --retry 3 \
            --output /tmp/runtime/wheels/astropy_iers_data-0.2026.7.27.0.56.29-py3-none-any.whl \
            'https://files.pythonhosted.org/packages/7b/02/df236615164fbd2fd29b04b5c44ff24949272612ccc84347071a074e0ce0/astropy_iers_data-0.2026.7.27.0.56.29-py3-none-any.whl'
          curl --fail --location --retry 3 \
            --output /tmp/runtime/wheels/packaging-26.2-py3-none-any.whl \
            'https://files.pythonhosted.org/packages/df/b2/87e62e8c3e2f4b32e5fe99e0b86d576da1312593b39f47d8ceef365e95ed/packaging-26.2-py3-none-any.whl'
          test "$(sha256sum /tmp/runtime/wheels/astropy_iers_data-0.2026.7.27.0.56.29-py3-none-any.whl | cut -d' ' -f1)" = '8106cce07e38e3e0422f755b8964e6d03ca4d4280bb134934c74d497711f8d2a'
          test "$(sha256sum /tmp/runtime/wheels/packaging-26.2-py3-none-any.whl | cut -d' ' -f1)" = '5fc45236b9446107ff2415ce77c807cee2862cb6fac22b8a73826d0693b0980e'
          cat > /tmp/runtime/requirements.freeze <<'EOF'
          PyYAML==6.0.3
          astropy-iers-data==0.2026.7.27.0.56.29
          astropy==6.0.1
          iniconfig==2.3.0
          numpy==1.26.4
          packaging==26.2
          pluggy==1.6.0
          pyerfa==2.0.1.5
          pytest==8.2.2
          scipy==1.11.4
          EOF
          test "$(sha256sum /tmp/runtime/requirements.freeze | cut -d' ' -f1)" = '7e84039e357df88dcf012fd4cebb8b4817625fb63208758a799dc76e7ef42891'
          (cd /tmp/runtime/wheels && sha256sum * | LC_ALL=C sort -k2 > ../wheel-manifest.sha256)
          test "$(sha256sum /tmp/runtime/wheel-manifest.sha256 | cut -d' ' -f1)" = 'a75bfdb37baaac7209a6e172917a18970dac1a48aad98d947addc6fa17748e4a'
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf /tmp/runtime/wheels.tar.gz -C /tmp/runtime wheels
          test "$(sha256sum /tmp/runtime/wheels.tar.gz | cut -d' ' -f1)" = '2b93e842ba98db65bef6a1073e073a55e694741de7ecd47878a6b949288eb8f1'
          python - <<'PY'
          import json, pathlib
          pathlib.Path('/tmp/result/runtime-recovery.json').write_text(json.dumps({
              'schema_version': 1,
              'stage': 'p4_5_exact_runtime_recovery_after_artifact_expiry',
              'status': 'PASS_RESTORED_ORIGINAL_FROZEN_WHEEL_IDENTITY',
              'original_bundle_member_scope': ['wheels/'],
              'recovery_transport': 'immutable_files_pythonhosted_content_address',
              'cdn_diagnostic_run_id': 31007161254,
              'source_run_id': 30734422166,
              'expired_original_artifact_id': 8829046472,
              'reupload_artifact_id': 8929087724,
              'reupload_artifact_digest': 'sha256:9535b504f064da03eac7c3a4dca4b793218a12c780f8fa41c381c6b8beec9933',
              'restored_versions': {
                  'astropy-iers-data': '0.2026.7.27.0.56.29',
                  'packaging': '26.2',
              },
              'requirements_freeze_sha256': '7e84039e357df88dcf012fd4cebb8b4817625fb63208758a799dc76e7ef42891',
              'wheel_manifest_sha256': 'a75bfdb37baaac7209a6e172917a18970dac1a48aad98d947addc6fa17748e4a',
              'wheel_bundle_sha256': '2b93e842ba98db65bef6a1073e073a55e694741de7ecd47878a6b949288eb8f1',
              'soda_requests_sent': 0,
              'image_bytes_downloaded': 0,
              'scores_computed': False,
          }, indent=2, sort_keys=True) + '\n')
          PY

      - name: Restore and verify exact public executor source
        run: |
          set -euo pipefail
          mkdir -p /tmp/source /tmp/private /tmp/result /tmp/patch /tmp/encrypted-result
          base64 -d .github/hou-lens-p4-5-execution/source.tar.gz.b64 >/tmp/source.tar.gz
          test "$(sha256sum /tmp/source.tar.gz | cut -d' ' -f1)" = 'e4bf0b14e0c3b7ec1b8b119eb49140c5bfa746813e9132ca957aba5a92515944'
          tar -xzf /tmp/source.tar.gz -C /tmp/source
          python - <<'PY'
          import pathlib, subprocess
          root = pathlib.Path('/tmp/source')
          expected = {
              'src/hou_lens/p4_image_acquisition.py': '0067fc525c0ddc3040cfc240e22d0cdee85cddbd',
              'src/hou_lens/p4_soda_manifest.py': 'eb2832a066eb147988bef297eb6180a8dca58e2f',
              'tests/test_p4_image_acquisition.py': '35fd3dd8327b20e2bddab2f299e2a6a955b3bfb7',
              'tests/test_p4_soda_manifest.py': 'e4af40d8ea3e9584204df9dd1cd23aff3e1d693e',
              'scripts/v3_execute_p4_1_locked_images.py': '26f9a7ed5529a98911a5d948e365eae611a0af8b',
          }
          actual = sorted(p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file())
          if actual != sorted(expected):
              raise SystemExit('unexpected public source file set')
          for name, wanted in expected.items():
              got = subprocess.check_output(['git', 'hash-object', '--stdin'], input=(root / name).read_bytes()).decode().strip()
              if got != wanted:
                  raise SystemExit(f'public source blob mismatch: {name}')
          PY

      - name: Wait for exact encrypted P4.5 scientific payload
        run: |
          set -euo pipefail
          found=0
          for attempt in $(seq 1 1800); do
            git fetch -q origin "+refs/heads/$PAYLOAD_BRANCH:refs/remotes/origin/$PAYLOAD_BRANCH"
            REF="refs/remotes/origin/$PAYLOAD_BRANCH"
            if git show "$REF:$PAYLOAD_DIR/manifest.json" >/tmp/payload-manifest.json 2>/dev/null; then
              if python - <<'PY'
          import json, os
          m = json.load(open('/tmp/payload-manifest.json'))
          checks = [
              str(m.get('run_id')) == os.environ['GITHUB_RUN_ID'],
              str(m.get('run_attempt')) == os.environ['GITHUB_RUN_ATTEMPT'],
              m.get('executor_head_sha') == os.environ['EXPECTED_HEAD_SHA'],
              m.get('protocol') == 'HOU-LENS-P4.5-SINGLE-SCIENTIFIC-EXECUTION',
              m.get('scientific_execution_payload') is True,
          ]
          raise SystemExit(0 if all(checks) else 1)
          PY
              then
                found=1
                break
              fi
            fi
            sleep 10
          done
          test "$found" = 1

          python - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess
          m = json.load(open('/tmp/payload-manifest.json'))
          ref = 'refs/remotes/origin/' + os.environ['PAYLOAD_BRANCH']
          prefix = os.environ['PAYLOAD_DIR'] + '/'
          actual_files = subprocess.check_output(
              ['git', 'ls-tree', '-r', '--name-only', ref, '--', os.environ['PAYLOAD_DIR']], text=True
          ).splitlines()
          expected_files = [prefix + 'manifest.json'] + [prefix + p['file'] for p in m['parts']]
          if sorted(actual_files) != sorted(expected_files):
              raise SystemExit('unexpected payload branch file set')
          assembled = bytearray()
          for part in m['parts']:
              raw = subprocess.check_output(['git', 'show', f"{ref}:{prefix}{part['file']}"])
              if len(raw) != int(part['bytes']):
                  raise SystemExit(f"payload part length mismatch: {part['file']}")
              if hashlib.sha256(raw).hexdigest() != part['sha256']:
                  raise SystemExit(f"payload part hash mismatch: {part['file']}")
              blob = subprocess.check_output(['git', 'hash-object', '--stdin'], input=raw).decode().strip()
              if blob != part['git_blob']:
                  raise SystemExit(f"payload part git blob mismatch: {part['file']}")
              assembled.extend(raw)
          if len(assembled) != int(m['base64_bytes']):
              raise SystemExit('global base64 length mismatch')
          if hashlib.sha256(assembled).hexdigest() != m['base64_sha256']:
              raise SystemExit('global base64 hash mismatch')
          der = base64.b64decode(bytes(assembled), validate=True)
          if len(der) != int(m['cms_der_bytes']):
              raise SystemExit('CMS length mismatch')
          if hashlib.sha256(der).hexdigest() != m['cms_der_sha256']:
              raise SystemExit('CMS hash mismatch')
          pathlib.Path('/tmp/payload.der').write_bytes(der)
          PY

          openssl cms -decrypt -binary -inform DER -in /tmp/payload.der \
            -recip runner.crt -inkey /tmp/runner.key -out /tmp/private-payload.tar.gz

          python - <<'PY'
          import hashlib, json, pathlib, tarfile
          m = json.load(open('/tmp/payload-manifest.json'))
          raw = pathlib.Path('/tmp/private-payload.tar.gz').read_bytes()
          if len(raw) != int(m['payload_tar_bytes']):
              raise SystemExit('private payload tar length mismatch')
          if hashlib.sha256(raw).hexdigest() != m['payload_tar_sha256']:
              raise SystemExit('private payload tar hash mismatch')
          expected = set(m['payload_files'])
          with tarfile.open('/tmp/private-payload.tar.gz', 'r:gz') as tf:
              members = tf.getmembers()
              names = {member.name for member in members}
              if names != expected:
                  raise SystemExit('private payload tar file-set mismatch')
              for member in members:
                  parts = pathlib.PurePosixPath(member.name).parts
                  if not member.isfile() or member.name.startswith('/') or '..' in parts:
                      raise SystemExit('unsafe private payload member')
              tf.extractall('/tmp/private')
          PY

      - name: Verify exact private inputs and continuation binding
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, hashlib, json, os, pathlib
          root = pathlib.Path('/tmp/private')
          expected_names = {
              'P4_1_ONE_USE_IMAGE_ACCESS_LOCK.json',
              'P4_1_IMAGE_OBJECT_MANIFEST.csv',
              'P4_1_SODA_REQUEST_MANIFEST.csv',
              'P4_5_CONTINUATION_CONSUMPTION_RECEIPT.json',
              'P4_5_EXECUTION_BINDING.json',
              'p4-5-result-recipient-cert.pem',
          }
          actual_names = {p.name for p in root.iterdir() if p.is_file()}
          if actual_names != expected_names:
              raise SystemExit('unexpected private input file set')
          expected_hashes = {
              'P4_1_ONE_USE_IMAGE_ACCESS_LOCK.json': '8a00c6681cebdd190da667711b7479d22ffcd175e677b0c740037eeab6976f1a',
              'P4_1_IMAGE_OBJECT_MANIFEST.csv': '79edba98bc3e61ee8c1be36174eb02e050c112478563f1119a8f7b330dccd795',
              'P4_1_SODA_REQUEST_MANIFEST.csv': 'd5c66c1288621e6826b56fb02658dd9bddcb449f82fa10eec135959b67436904',
              'p4-5-result-recipient-cert.pem': '2d422369d97fef839023cc42b40816ec781815cab971c4f751959f77088bd4fd',
          }
          for name, wanted in expected_hashes.items():
              got = hashlib.sha256((root / name).read_bytes()).hexdigest()
              if got != wanted:
                  raise SystemExit(f'private input hash mismatch: {name}')
          lock_raw = (root / 'P4_1_ONE_USE_IMAGE_ACCESS_LOCK.json').read_bytes()
          lock = json.loads(lock_raw)
          if lock.get('status') != 'SEALED_NOT_CONSUMED':
              raise SystemExit('final lock status mismatch')
          if lock.get('lock_sha256') != 'afd688befe6901ced3d732cf450d619e50f462b353c6547dcf715c196d003a78':
              raise SystemExit('final lock internal identity mismatch')
          with (root / 'P4_1_IMAGE_OBJECT_MANIFEST.csv').open(newline='', encoding='utf-8') as f:
              objects = list(csv.DictReader(f))
          with (root / 'P4_1_SODA_REQUEST_MANIFEST.csv').open(newline='', encoding='utf-8') as f:
              requests = list(csv.DictReader(f))
          if len(objects) != 188:
              raise SystemExit('object count mismatch')
          if len(requests) != 940 or len({r['request_key'] for r in requests}) != 940:
              raise SystemExit('request count or uniqueness mismatch')
          if {r['soda_endpoint'] for r in requests} != {'https://dataportal.eso.org/dataPortal/soda/sync'}:
              raise SystemExit('SODA endpoint mismatch')
          consumption = json.loads((root / 'P4_5_CONTINUATION_CONSUMPTION_RECEIPT.json').read_text())
          consumption_checks = [
              consumption.get('status') == 'CONSUMPTION_ACTIVE',
              consumption.get('count') == 1,
              consumption.get('maximum_count') == 1,
              consumption.get('authorization_record_count') == 1,
              consumption.get('new_scientific_authorization_created') is False,
              consumption.get('scientific_access_execution_count_before_run') == 0,
              consumption.get('lock_file_sha256') == expected_hashes['P4_1_ONE_USE_IMAGE_ACCESS_LOCK.json'],
              consumption.get('prior_consumption_receipt_sha256') == '54fa1b0a56a2f430240fb588615e12c4764b57b21be1e215f5457e70889fce53',
              str(consumption.get('run_id')) == os.environ['GITHUB_RUN_ID'],
              str(consumption.get('run_attempt')) == os.environ['GITHUB_RUN_ATTEMPT'],
              consumption.get('executor_head_sha') == os.environ['EXPECTED_HEAD_SHA'],
              consumption.get('soda_requests_sent') == 0,
              consumption.get('image_bytes_downloaded') == 0,
              consumption.get('scores_computed') is False,
          ]
          if not all(consumption_checks):
              raise SystemExit('continuation consumption receipt mismatch')
          binding = json.loads((root / 'P4_5_EXECUTION_BINDING.json').read_text())
          runner_cert_sha = hashlib.sha256(pathlib.Path('runner.crt').read_bytes()).hexdigest()
          result_cert_sha = hashlib.sha256((root / 'p4-5-result-recipient-cert.pem').read_bytes()).hexdigest()
          binding_checks = [
              str(binding.get('run_id')) == os.environ['GITHUB_RUN_ID'],
              str(binding.get('run_attempt')) == os.environ['GITHUB_RUN_ATTEMPT'],
              binding.get('executor_head_sha') == os.environ['EXPECTED_HEAD_SHA'],
              binding.get('runner_certificate_sha256') == runner_cert_sha,
              binding.get('result_recipient_certificate_sha256') == result_cert_sha,
              binding.get('authorization_record_count') == 1,
              binding.get('scientific_access_execution_count_before_run') == 0,
              binding.get('planned_soda_requests') == 940,
              binding.get('scientific_inputs_changed') is False,
              binding.get('scores_available_during_acquisition') is False,
          ]
          if not all(binding_checks):
              raise SystemExit('execution binding mismatch')
          evidence = {
              'schema_version': 1,
              'stage': 'p4_5_exact_input_verification',
              'status': 'PASS_EXACT_PRIVATE_INPUT_AND_CONTINUATION_BINDING',
              'run_id': os.environ['GITHUB_RUN_ID'],
              'executor_head_sha': os.environ['EXPECTED_HEAD_SHA'],
              'objects': 188,
              'planned_soda_requests': 940,
              'authorization_record_count': 1,
              'scientific_access_execution_count_before_run': 0,
              'soda_requests_sent_before_gate': 0,
              'image_bytes_downloaded_before_gate': 0,
              'scores_computed_before_gate': False,
          }
          pathlib.Path('/tmp/result/input-verification.json').write_text(json.dumps(evidence, indent=2, sort_keys=True) + '\n')
          PY

      - name: Re-run exact offline runtime gate before scientific access
        run: |
          set -euo pipefail
          test "$(sha256sum /tmp/runtime/wheels.tar.gz | cut -d' ' -f1)" = '2b93e842ba98db65bef6a1073e073a55e694741de7ecd47878a6b949288eb8f1'
          test "$(sha256sum /tmp/runtime/wheel-manifest.sha256 | cut -d' ' -f1)" = 'a75bfdb37baaac7209a6e172917a18970dac1a48aad98d947addc6fa17748e4a'
          PATCH_TAR_SHA="$(sha256sum /tmp/patch-artifact/p4-5-requests-runtime-patch.tar.gz | cut -d' ' -f1)"
          PATCH_RECEIPT_SHA="$(sha256sum /tmp/patch-artifact/p4-5-requests-runtime-patch-receipt.json | cut -d' ' -f1)"
          case "$PATCH_TAR_SHA:$PATCH_RECEIPT_SHA" in
            a8160b489191039c5f2be23be741c12e02323099d7d9f00ca9c62324f94e4f5b:01169787e45dea3f370a6ca7d789167770cf3b547b0cfd736b9b77ebce9d598a) ;;
            b045abf18df056e99fa2aa47219136b18f2b3f115fcd3db9336d1b1ebabda28a:63a464ae49d4b7b760de5eb2465a35c2e0e952b1bbdaf1baf2543fc1abb44c91) ;;
            *) echo "unrecognized Requests patch wrapper identity" >&2; exit 1 ;;
          esac
          tar -xzf /tmp/patch-artifact/p4-5-requests-runtime-patch.tar.gz -C /tmp/patch
          test "$(sha256sum /tmp/patch/requests-wheel-manifest.sha256 | cut -d' ' -f1)" = '952a86e2842f5f4cfb35de196fa8587af949a6732a57edf8a2c43be96665d3d3'
          test "$(sha256sum /tmp/patch/p4_5_requests_runtime_closure.json | cut -d' ' -f1)" = 'a92efee14a834137f3d78abdc2dcfc163e60ba3a4b4a91910d165393e8b3c497'
          python - "$PATCH_TAR_SHA" "$PATCH_RECEIPT_SHA" <<'PY'
          import json, pathlib, sys
          pathlib.Path('/tmp/result/requests-patch-wrapper.json').write_text(json.dumps({
              'schema_version': 1,
              'stage': 'p4_5_requests_patch_wrapper_identity',
              'status': 'PASS_ALLOWED_WRAPPER_AND_EXACT_INNER_WHEELS',
              'source_run_id': 30808837306,
              'patch_tar_sha256': sys.argv[1],
              'patch_receipt_sha256': sys.argv[2],
              'inner_wheel_manifest_sha256': '952a86e2842f5f4cfb35de196fa8587af949a6732a57edf8a2c43be96665d3d3',
              'closure_sha256': 'a92efee14a834137f3d78abdc2dcfc163e60ba3a4b4a91910d165393e8b3c497',
              'soda_requests_sent': 0,
              'image_bytes_downloaded': 0,
              'scores_computed': False,
          }, indent=2, sort_keys=True) + '\n')
          PY
          IMAGE='python@sha256:86adf8dbadc3d6e82ee5dd2c74bec2e1c2467cdad47886280501df722372d2e1'
          docker pull "$IMAGE" >/dev/null
          docker run --rm --network none \
            -v /tmp/source:/work:ro -v /tmp/runtime:/runtime:ro -v /tmp/patch:/patch:ro -v /tmp/result:/result \
            "$IMAGE" sh -lc '
              set -eu
              export PYTHONPYCACHEPREFIX=/result/preflight-pycache
              mkdir -p "$PYTHONPYCACHEPREFIX"
              cd /runtime/wheels && sha256sum -c ../wheel-manifest.sha256 >/dev/null
              cd /patch && sha256sum -c requests-wheel-manifest.sha256 >/dev/null
              python -m pip install --disable-pip-version-check --no-index --find-links /runtime/wheels -r /runtime/requirements.in >/dev/null
              python -m pip install --disable-pip-version-check --no-index --find-links /patch requests==2.32.5 >/dev/null
              cd /work
              PYTHONPATH=src python -m py_compile scripts/v3_execute_p4_1_locked_images.py
              PYTHONPATH=src:. pytest -q -p no:cacheprovider --junitxml=/result/final-gate-junit.xml tests/test_p4_image_acquisition.py tests/test_p4_soda_manifest.py >/result/final-gate-pytest.txt
              PYTHONPATH=src:. python -c "import json,requests,scripts.v3_execute_p4_1_locked_images as executor; open(\"/result/final-gate-import.json\",\"w\").write(json.dumps({\"executor_imported\":True,\"executor_module\":executor.__name__,\"requests_version\":requests.__version__},sort_keys=True)+\"\\n\")"
            '
          python - <<'PY'
          import json, pathlib, xml.etree.ElementTree as ET
          root = ET.parse('/tmp/result/final-gate-junit.xml').getroot()
          suite = root if root.tag == 'testsuite' else root.find('testsuite')
          counts = {k: int(suite.attrib.get(k, '-1')) for k in ('tests', 'failures', 'errors', 'skipped')}
          imported = json.loads(pathlib.Path('/tmp/result/final-gate-import.json').read_text())
          if counts != {'tests': 8, 'failures': 0, 'errors': 0, 'skipped': 0}:
              raise SystemExit('final exact test gate failed')
          if imported != {'executor_imported': True, 'executor_module': 'scripts.v3_execute_p4_1_locked_images', 'requests_version': '2.32.5'}:
              raise SystemExit('final executor import gate failed')
          pathlib.Path('/tmp/result/final-runtime-gate.json').write_text(json.dumps({
              'schema_version': 1,
              'stage': 'p4_5_final_runtime_gate_immediately_before_scientific_access',
              'status': 'PASS',
              **counts,
              **imported,
              'network_disabled': True,
              'soda_requests_sent_before_gate': 0,
              'image_bytes_downloaded_before_gate': 0,
              'scores_computed_before_gate': False,
          }, indent=2, sort_keys=True) + '\n')
          PY

      - name: Execute the exact frozen 940-request acquisition once
        run: |
          set -euo pipefail
          IMAGE='python@sha256:86adf8dbadc3d6e82ee5dd2c74bec2e1c2467cdad47886280501df722372d2e1'
          set +e
          docker run --rm \
            -e GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            -v /tmp/source:/work:ro -v /tmp/private:/private:ro \
            -v /tmp/runtime:/runtime:ro -v /tmp/patch:/patch:ro -v /tmp/result:/result \
            "$IMAGE" sh -lc '
              set -eu
              export PYTHONPYCACHEPREFIX=/result/execution-pycache
              mkdir -p "$PYTHONPYCACHEPREFIX"
              python -m pip install --disable-pip-version-check --no-index --find-links /runtime/wheels -r /runtime/requirements.in >/dev/null
              python -m pip install --disable-pip-version-check --no-index --find-links /patch requests==2.32.5 >/dev/null
              cd /work
              PYTHONPATH=src python scripts/v3_execute_p4_1_locked_images.py \
                --lock /private/P4_1_ONE_USE_IMAGE_ACCESS_LOCK.json \
                --objects /private/P4_1_IMAGE_OBJECT_MANIFEST.csv \
                --requests /private/P4_1_SODA_REQUEST_MANIFEST.csv \
                --consumption /private/P4_5_CONTINUATION_CONSUMPTION_RECEIPT.json \
                --output-dir /result/acquisition \
                --workers 4 --timeout-seconds 180 --max-attempts 3 \
                >/result/executor-stdout.jsonl 2>/result/executor-stderr.log
            '
          code=$?
          set -e
          printf '%s\n' "$code" >/tmp/result/executor-exit-code.txt

      - name: Independently audit and encrypt every private result byte
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, hashlib, json, os, pathlib
          result = pathlib.Path('/tmp/result')
          acquisition = result / 'acquisition'
          private = pathlib.Path('/tmp/private')
          exit_path = result / 'executor-exit-code.txt'
          if not exit_path.is_file():
              exit_path.write_text('190\n')
          exit_code = int(exit_path.read_text().strip())
          audit = {
              'schema_version': 1,
              'stage': 'p4_5_independent_score_opaque_acquisition_audit',
              'run_id': os.environ['GITHUB_RUN_ID'],
              'executor_exit_code': exit_code,
              'scorer_available': False,
              'scores_computed': False,
              'unknown_dr5_only_targets_queried': False,
              'blind_search_performed': False,
          }
          required = ['request_receipts.jsonl', 'technical_quality.json', 'technical_cohort.json', 'fits_manifest.json', 'acquisition_receipt.json']
          missing = [name for name in required if not (acquisition / name).is_file()]
          audit['missing_required_result_files'] = missing
          if exit_code == 0 and missing:
              raise SystemExit('successful executor omitted required result files')
          if not missing:
              requests = list(csv.DictReader((private / 'P4_1_SODA_REQUEST_MANIFEST.csv').open(newline='', encoding='utf-8')))
              expected_keys = [row['request_key'] for row in requests]
              receipts = [json.loads(line) for line in (acquisition / 'request_receipts.jsonl').read_text().splitlines() if line]
              if len(receipts) != 940 or [row['request_key'] for row in receipts] != expected_keys:
                  raise SystemExit('request receipt completeness or ordering mismatch')
              manifest = json.loads((acquisition / 'fits_manifest.json').read_text())
              fits_dir = acquisition / 'fits'
              actual_fits = sorted(p.name for p in fits_dir.glob('*.fits')) if fits_dir.is_dir() else []
              manifest_names = sorted(row['file'] for row in manifest)
              if actual_fits != manifest_names or len(manifest_names) != len(set(manifest_names)):
                  raise SystemExit('FITS manifest file-set mismatch')
              for row in manifest:
                  path = fits_dir / row['file']
                  if path.stat().st_size != int(row['bytes']):
                      raise SystemExit('FITS byte-count mismatch')
                  if hashlib.sha256(path.read_bytes()).hexdigest() != row['sha256']:
                      raise SystemExit('FITS hash mismatch')
              receipt = json.loads((acquisition / 'acquisition_receipt.json').read_text())
              if str(receipt.get('run_id')) != os.environ['GITHUB_RUN_ID']:
                  raise SystemExit('acquisition receipt run mismatch')
              if receipt.get('request_count') != 940 or receipt.get('scorer_available') is not False or receipt.get('scores_computed') is not False:
                  raise SystemExit('acquisition receipt contract mismatch')
              if receipt.get('unknown_dr5_only_targets_queried') is not False or receipt.get('blind_search_performed') is not False:
                  raise SystemExit('acquisition boundary mismatch')
              audit.update({
                  'status': 'PASS_INDEPENDENT_PRIVATE_BYTE_AUDIT',
                  'request_receipt_count': 940,
                  'unique_request_key_count': 940,
                  'fits_file_count': len(manifest),
                  'fits_total_bytes': sum(int(row['bytes']) for row in manifest),
                  'acquisition_receipt_sha256': hashlib.sha256((acquisition / 'acquisition_receipt.json').read_bytes()).hexdigest(),
                  'request_receipts_sha256': hashlib.sha256((acquisition / 'request_receipts.jsonl').read_bytes()).hexdigest(),
                  'technical_quality_sha256': hashlib.sha256((acquisition / 'technical_quality.json').read_bytes()).hexdigest(),
                  'technical_cohort_sha256': hashlib.sha256((acquisition / 'technical_cohort.json').read_bytes()).hexdigest(),
                  'fits_manifest_sha256': hashlib.sha256((acquisition / 'fits_manifest.json').read_bytes()).hexdigest(),
              })
          else:
              audit['status'] = 'ENCRYPTED_PARTIAL_EXECUTION_EVIDENCE'
          (result / 'independent-audit.json').write_text(json.dumps(audit, indent=2, sort_keys=True) + '\n')
          context = {
              'schema_version': 1,
              'stage': 'p4_5_private_result_context',
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'executor_head_sha': os.environ['EXPECTED_HEAD_SHA'],
              'executor_git_blob': '26f9a7ed5529a98911a5d948e365eae611a0af8b',
              'source_tar_sha256': 'e4bf0b14e0c3b7ec1b8b119eb49140c5bfa746813e9132ca957aba5a92515944',
              'base_runtime_source_run_id': 30734422166,
              'base_runtime_expired_original_artifact_id': 8829046472,
              'base_runtime_reupload_artifact_id': 8929087724,
              'base_runtime_reupload_artifact_digest': 'sha256:9535b504f064da03eac7c3a4dca4b793218a12c780f8fa41c381c6b8beec9933',
              'base_runtime_restored_wheel_bundle_sha256': '2b93e842ba98db65bef6a1073e073a55e694741de7ecd47878a6b949288eb8f1',
              'requests_patch_source_run_id': 30808837306,
              'requests_patch_original_artifact_id': 8853932417,
              'requests_patch_reupload_artifact_id': 8929113579,
              'requests_patch_reupload_artifact_digest': 'sha256:06b877996532c15c49228c711ab18e717f62f840ce0f3b28e651cd4ab49f613e',
              'requests_patch_inner_manifest_sha256': '952a86e2842f5f4cfb35de196fa8587af949a6732a57edf8a2c43be96665d3d3',
              'lock_sha256': '8a00c6681cebdd190da667711b7479d22ffcd175e677b0c740037eeab6976f1a',
              'object_manifest_sha256': '79edba98bc3e61ee8c1be36174eb02e050c112478563f1119a8f7b330dccd795',
              'soda_request_manifest_sha256': 'd5c66c1288621e6826b56fb02658dd9bddcb449f82fa10eec135959b67436904',
              'authorization_record_count': 1,
              'scientific_access_execution_count_before_run': 0,
          }
          (result / 'private-result-context.json').write_text(json.dumps(context, indent=2, sort_keys=True) + '\n')
          PY

          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf /tmp/private-result.tar.gz -C /tmp/result .
          openssl cms -encrypt -binary -aes-256-cbc -stream -outform DER \
            -in /tmp/private-result.tar.gz -out /tmp/private-result.cms \
            /tmp/private/p4-5-result-recipient-cert.pem
          split -b 400M -d -a 3 /tmp/private-result.cms /tmp/encrypted-result/result-part-
          python - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path('/tmp/encrypted-result')
          cms = pathlib.Path('/tmp/private-result.cms')
          tar = pathlib.Path('/tmp/private-result.tar.gz')
          parts = []
          for path in sorted(root.glob('result-part-*')):
              raw = path.read_bytes()
              parts.append({'file': path.name, 'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()})
          manifest = {
              'schema_version': 1,
              'protocol': 'HOU-LENS-P4.5-ENCRYPTED-PRIVATE-RESULT',
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'executor_head_sha': os.environ['EXPECTED_HEAD_SHA'],
              'encryption': 'CMS DER AES-256-CBC streaming',
              'recipient_certificate_sha256': '2d422369d97fef839023cc42b40816ec781815cab971c4f751959f77088bd4fd',
              'private_tar_bytes': tar.stat().st_size,
              'private_tar_sha256': hashlib.sha256(tar.read_bytes()).hexdigest(),
              'cms_der_bytes': cms.stat().st_size,
              'cms_der_sha256': hashlib.sha256(cms.read_bytes()).hexdigest(),
              'part_count': len(parts),
              'parts': parts,
              'public_plaintext_scientific_result': False,
              'scores_publicly_exposed': False,
          }
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          PY
          cp /tmp/result/executor-exit-code.txt /tmp/encrypted-result/executor-exit-code.txt
          rm -rf /tmp/private /tmp/result /tmp/source /tmp/private-result.tar.gz /tmp/private-result.cms /tmp/payload.der /tmp/private-payload.tar.gz /tmp/runner.key

      - name: Upload encrypted P4.5 private result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hou-lens-p4-5-encrypted-private-result-${{ github.run_id }}
          path: /tmp/encrypted-result/*
          retention-days: 3
          compression-level: 0

      - name: Enforce successful executor completion after encrypted return
        if: always()
        run: |
          set -euo pipefail
          test -f /tmp/encrypted-result/executor-exit-code.txt
          test "$(cat /tmp/encrypted-result/executor-exit-code.txt)" = '0'
