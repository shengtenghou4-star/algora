name: HOU-LENS P4.6 comment transport publisher

on:
  push:
    branches:
      - hou-lens-p4-5-scientific-payload
    paths:
      - .github/hou-lens-p46-transport-trigger.txt

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  recover-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_BRANCH: hou-lens-p4-5-scientific-payload
      PAYLOAD_DIR: .github/hou-lens-p4-5-scientific-payload
      PR_NUMBER: '11'
      EXPECTED_RUN_ID: '30832075911'
      EXPECTED_RUN_ATTEMPT: '3'
      EXPECTED_HEAD_SHA: 73661d25bbd016e96b7f71847e9b3b20b43a1b5c
      EXPECTED_B64_BYTES: '114304'
      EXPECTED_B64_SHA256: d96eccc2f6eb3b7f35497e0ebe67a9def9cd95d902d0f5f0b94ac7d68dca8e1f
      EXPECTED_CMS_BYTES: '85726'
      EXPECTED_CMS_SHA256: b09dabae1bccec3497ad9dfcfcd262a6b759006c336b3411d3459f70099d010e
      EXPECTED_TAR_BYTES: '85062'
      EXPECTED_TAR_SHA256: 65e28ef98d31b2a4ab37cadf3d923fd458290cc377273ecee2c6d4e30ff9851a
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hou-lens-p4-5-scientific-payload
          fetch-depth: 0

      - name: Recover exact transport bytes from PR comments
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import pathlib
          import re
          import urllib.request
          import zlib

          repo = os.environ['REPOSITORY']
          pr = os.environ['PR_NUMBER']
          token = os.environ['GH_TOKEN']
          expected_run = os.environ['EXPECTED_RUN_ID']
          expected_attempt = os.environ['EXPECTED_RUN_ATTEMPT']

          comments = []
          page = 1
          while True:
              url = f'https://api.github.com/repos/{repo}/issues/{pr}/comments?per_page=100&page={page}'
              req = urllib.request.Request(
                  url,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'hou-lens-p46-transport',
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  batch = json.load(response)
              comments.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          header_re = re.compile(
              r'^HOU-LENS-P46-TRANSPORT v1 run=(\d+) attempt=(\d+) replica=([ABC]) group=(\d+)$'
          )
          block_re = re.compile(r'^P(\d{3}) crc32=([0-9a-f]{8}) len=(\d+)$')
          alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          inverse_rot = {alphabet[(i + 7) % 64]: alphabet[i] for i in range(64)}

          candidates = {i: [] for i in range(28)}
          seen_comment_ids = []
          for comment in comments:
              body = comment.get('body') or ''
              lines = body.splitlines()
              if not lines:
                  continue
              header = header_re.fullmatch(lines[0].strip())
              if not header:
                  continue
              run_id, attempt, replica, group = header.groups()
              if run_id != expected_run or attempt != expected_attempt:
                  continue
              seen_comment_ids.append(comment['id'])
              index = 1
              while index < len(lines):
                  match = block_re.fullmatch(lines[index].strip())
                  if not match or index + 1 >= len(lines):
                      index += 1
                      continue
                  part_index = int(match.group(1))
                  wanted_crc = match.group(2)
                  wanted_len = int(match.group(3))
                  encoded = lines[index + 1].strip()
                  if replica == 'A':
                      decoded = encoded
                  elif replica == 'B':
                      decoded = encoded[::-1]
                  else:
                      decoded = ''.join('=' if ch == '=' else inverse_rot.get(ch, '?') for ch in encoded)
                  raw = decoded.encode('ascii', errors='strict')
                  got_crc = f'{zlib.crc32(raw) & 0xffffffff:08x}'
                  valid = (
                      0 <= part_index < 28
                      and len(raw) == wanted_len
                      and got_crc == wanted_crc
                      and set(decoded) <= set(alphabet + '=')
                  )
                  if valid:
                      candidates[part_index].append((replica, decoded, comment['id']))
                  index += 2

          missing = [i for i, rows in candidates.items() if not rows]
          conflicts = []
          recovered = []
          provenance = []
          for i in range(28):
              rows = candidates[i]
              if not rows:
                  continue
              values = {row[1] for row in rows}
              if len(values) != 1:
                  conflicts.append(i)
                  continue
              value = next(iter(values))
              recovered.append(value)
              provenance.append({
                  'part_index': i,
                  'replicas': sorted({row[0] for row in rows}),
                  'comment_ids': sorted({row[2] for row in rows}),
                  'bytes': len(value),
                  'crc32': f'{zlib.crc32(value.encode()) & 0xffffffff:08x}',
              })

          audit = {
              'schema_version': 1,
              'stage': 'p4_6_comment_transport_recovery',
              'run_id': expected_run,
              'run_attempt': expected_attempt,
              'matching_comment_ids': sorted(set(seen_comment_ids)),
              'valid_candidate_counts': {str(i): len(candidates[i]) for i in range(28)},
              'missing_parts': missing,
              'conflicting_parts': conflicts,
              'provenance': provenance,
          }
          pathlib.Path('/tmp/transport-audit.json').write_text(
              json.dumps(audit, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(audit, indent=2, sort_keys=True))
          if missing or conflicts:
              raise SystemExit('transport recovery incomplete')

          assembled = ''.join(recovered).encode('ascii')
          if len(assembled) != int(os.environ['EXPECTED_B64_BYTES']):
              raise SystemExit('global base64 byte count mismatch')
          if hashlib.sha256(assembled).hexdigest() != os.environ['EXPECTED_B64_SHA256']:
              raise SystemExit('global base64 sha256 mismatch')
          der = base64.b64decode(assembled, validate=True)
          if len(der) != int(os.environ['EXPECTED_CMS_BYTES']):
              raise SystemExit('CMS byte count mismatch')
          if hashlib.sha256(der).hexdigest() != os.environ['EXPECTED_CMS_SHA256']:
              raise SystemExit('CMS sha256 mismatch')
          pathlib.Path('/tmp/payload.b64').write_bytes(assembled)
          pathlib.Path('/tmp/payload.der').write_bytes(der)
          print('PASS_COMMENT_TRANSPORT_GLOBAL_HASHES')
          PY

      - name: Publish parts atomically without manifest
        run: |
          set -euo pipefail
          git config user.name 'hou-lens-p46-transport-bot'
          git config user.email 'hou-lens-p46-transport-bot@users.noreply.github.com'
          rm -rf "$PAYLOAD_DIR"
          mkdir -p "$PAYLOAD_DIR"
          split -b 28576 -d -a 3 /tmp/payload.b64 /tmp/formal-part-
          python - <<'PY'
          import pathlib
          src = sorted(pathlib.Path('/tmp').glob('formal-part-*'))
          if len(src) != 4 or any(p.stat().st_size != 28576 for p in src):
              raise SystemExit('formal four-part split mismatch')
          root = pathlib.Path('.github/hou-lens-p4-5-scientific-payload')
          for i, path in enumerate(src, 1):
              (root / f'part-{i:03d}.b64').write_bytes(path.read_bytes())
          PY
          git add -A "$PAYLOAD_DIR"
          git commit -m 'Publish P4.6 attempt 3 encrypted payload parts'
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Publish manifest last
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess

          root = pathlib.Path(os.environ['PAYLOAD_DIR'])
          parts = []
          for path in sorted(root.glob('part-*.b64')):
              raw = path.read_bytes()
              blob = subprocess.check_output(['git', 'hash-object', '--stdin'], input=raw).decode().strip()
              parts.append({
                  'file': path.name,
                  'bytes': len(raw),
                  'sha256': hashlib.sha256(raw).hexdigest(),
                  'git_blob': blob,
              })
          if len(parts) != 4 or sum(row['bytes'] for row in parts) != int(os.environ['EXPECTED_B64_BYTES']):
              raise SystemExit('formal manifest part-set mismatch')
          manifest = {
              'schema_version': 2,
              'protocol': 'HOU-LENS-P4.5-SINGLE-SCIENTIFIC-EXECUTION',
              'scientific_execution_payload': True,
              'run_id': os.environ['EXPECTED_RUN_ID'],
              'run_attempt': os.environ['EXPECTED_RUN_ATTEMPT'],
              'executor_head_sha': os.environ['EXPECTED_HEAD_SHA'],
              'payload_files': [
                  'P4_1_IMAGE_OBJECT_MANIFEST.csv',
                  'P4_1_ONE_USE_IMAGE_ACCESS_LOCK.json',
                  'P4_1_SODA_REQUEST_MANIFEST.csv',
                  'P4_5_CONTINUATION_CONSUMPTION_RECEIPT.json',
                  'P4_5_EXECUTION_BINDING.json',
                  'p4-5-result-recipient-cert.pem',
              ],
              'payload_tar_bytes': int(os.environ['EXPECTED_TAR_BYTES']),
              'payload_tar_sha256': os.environ['EXPECTED_TAR_SHA256'],
              'cms_der_bytes': int(os.environ['EXPECTED_CMS_BYTES']),
              'cms_der_sha256': os.environ['EXPECTED_CMS_SHA256'],
              'base64_bytes': int(os.environ['EXPECTED_B64_BYTES']),
              'base64_sha256': os.environ['EXPECTED_B64_SHA256'],
              'parts': parts,
          }
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY
          git add "$PAYLOAD_DIR/manifest.json"
          git commit -m 'Publish P4.6 attempt 3 manifest last'
          git push origin "HEAD:$TARGET_BRANCH"
