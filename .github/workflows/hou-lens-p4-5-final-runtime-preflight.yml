name: HOU-LENS P4.5 final runtime preflight

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/hou-lens-p4-5-final-runtime-preflight.yml

permissions:
  contents: read
  actions: read

jobs:
  final-runtime-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Download frozen base runtime
        uses: actions/download-artifact@v4
        with:
          name: hou-lens-p4-1-runtime-30734422166
          path: /tmp/runtime
          repository: shengtenghou4-star/algora
          run-id: 30734422166
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download frozen Requests runtime patch
        uses: actions/download-artifact@v4
        with:
          name: hou-lens-p4-5-requests-runtime-patch-30808837306
          path: /tmp/patch-artifact
          repository: shengtenghou4-star/algora
          run-id: 30808837306
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore and verify exact frozen source
        run: |
          set -euo pipefail
          mkdir -p /tmp/work /tmp/result /tmp/patch
          cp .github/hou-lens-p4-5-runtime-preflight/source.tar.gz.b64 /tmp/source.tar.gz.b64
          base64 -d /tmp/source.tar.gz.b64 >/tmp/source.tar.gz
          test "$(sha256sum /tmp/source.tar.gz | cut -d' ' -f1)" = 'e4bf0b14e0c3b7ec1b8b119eb49140c5bfa746813e9132ca957aba5a92515944'
          tar -xzf /tmp/source.tar.gz -C /tmp/work
          python - <<'PY2'
          import pathlib,subprocess
          root=pathlib.Path('/tmp/work')
          expected={
            'src/hou_lens/p4_image_acquisition.py':'0067fc525c0ddc3040cfc240e22d0cdee85cddbd',
            'src/hou_lens/p4_soda_manifest.py':'eb2832a066eb147988bef297eb6180a8dca58e2f',
            'tests/test_p4_image_acquisition.py':'35fd3dd8327b20e2bddab2f299e2a6a955b3bfb7',
            'tests/test_p4_soda_manifest.py':'e4af40d8ea3e9584204df9dd1cd23aff3e1d693e',
            'scripts/v3_execute_p4_1_locked_images.py':'26f9a7ed5529a98911a5d948e365eae611a0af8b',
          }
          actual=sorted(p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file())
          if actual!=sorted(expected): raise SystemExit('unexpected source file set')
          for name,want in expected.items():
              got=subprocess.check_output(['git','hash-object','--stdin'],input=(root/name).read_bytes()).decode().strip()
              if got!=want: raise SystemExit(f'blob mismatch {name}')
          PY2
          cat >/tmp/work/import_check.py <<'PY4'
          import json
          import requests
          import scripts.v3_execute_p4_1_locked_images as executor
          open('/result/import.json','w').write(json.dumps({'executor_imported':True,'requests_version':requests.__version__,'executor_module':executor.__name__},sort_keys=True)+'\n')
          PY4

      - name: Verify both runtime layers and execute exact offline gate
        run: |
          set -euo pipefail
          test "$(sha256sum /tmp/runtime/wheels.tar.gz | cut -d' ' -f1)" = '2b93e842ba98db65bef6a1073e073a55e694741de7ecd47878a6b949288eb8f1'
          test "$(sha256sum /tmp/runtime/wheel-manifest.sha256 | cut -d' ' -f1)" = 'a75bfdb37baaac7209a6e172917a18970dac1a48aad98d947addc6fa17748e4a'
          test "$(sha256sum /tmp/patch-artifact/p4-5-requests-runtime-patch.tar.gz | cut -d' ' -f1)" = 'a8160b489191039c5f2be23be741c12e02323099d7d9f00ca9c62324f94e4f5b'
          test "$(sha256sum /tmp/patch-artifact/p4-5-requests-runtime-patch-receipt.json | cut -d' ' -f1)" = '01169787e45dea3f370a6ca7d789167770cf3b547b0cfd736b9b77ebce9d598a'
          tar -xzf /tmp/patch-artifact/p4-5-requests-runtime-patch.tar.gz -C /tmp/patch
          test "$(sha256sum /tmp/patch/requests-wheel-manifest.sha256 | cut -d' ' -f1)" = '952a86e2842f5f4cfb35de196fa8587af949a6732a57edf8a2c43be96665d3d3'
          IMAGE='python@sha256:86adf8dbadc3d6e82ee5dd2c74bec2e1c2467cdad47886280501df722372d2e1'
          docker pull "$IMAGE" >/dev/null
          docker run --rm --network none \
            -v /tmp/work:/work:ro -v /tmp/runtime:/runtime:ro -v /tmp/patch:/patch:ro -v /tmp/result:/result \
            "$IMAGE" sh -lc '
              set -eu
              cd /runtime/wheels && sha256sum -c ../wheel-manifest.sha256 >/dev/null
              cd /patch && sha256sum -c requests-wheel-manifest.sha256 >/dev/null
              python -m pip install --disable-pip-version-check --no-index --find-links /runtime/wheels -r /runtime/requirements.in >/dev/null
              python -m pip install --disable-pip-version-check --no-index --find-links /patch requests==2.32.5 >/dev/null
              cd /work
              PYTHONPATH=src python -m py_compile scripts/v3_execute_p4_1_locked_images.py
              PYTHONPATH=src:. pytest -q -p no:cacheprovider --junitxml=/result/junit.xml tests/test_p4_image_acquisition.py tests/test_p4_soda_manifest.py > /result/pytest.txt
              PYTHONPATH=src:. python /work/import_check.py
            '
          python - <<'PY3'
          import json,os,pathlib,xml.etree.ElementTree as ET
          root=ET.parse('/tmp/result/junit.xml').getroot(); suite=root if root.tag=='testsuite' else root.find('testsuite')
          counts={k:int(suite.attrib.get(k,'-1')) for k in ('tests','failures','errors','skipped')}
          imp=json.loads(pathlib.Path('/tmp/result/import.json').read_text())
          if counts!={'tests':8,'failures':0,'errors':0,'skipped':0}: raise SystemExit('exact test gate failed')
          if imp!={'executor_imported':True,'executor_module':'scripts.v3_execute_p4_1_locked_images','requests_version':'2.32.5'}: raise SystemExit('executor import gate failed')
          receipt={
            'schema_version':1,'stage':'p4_5_final_runtime_preflight','status':'PASS_FINAL_P4_5_RUNTIME_PREFLIGHT',
            'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'executor_head_sha':os.environ['EXPECTED_HEAD_SHA'],
            'container_image':'python@sha256:86adf8dbadc3d6e82ee5dd2c74bec2e1c2467cdad47886280501df722372d2e1',
            'base_runtime_artifact_id':8829046472,'base_runtime_artifact_digest':'sha256:f655443bfece4634b856d66d398efaa6f4d726ae1760726b651a92f885f98d9f',
            'requests_patch_artifact_id':8853932417,'requests_patch_artifact_digest':'sha256:31630df77b54431460febab4f3eb935490a843eadf8389314fc04f0d211bdb94',
            'source_tar_sha256':'e4bf0b14e0c3b7ec1b8b119eb49140c5bfa746813e9132ca957aba5a92515944',
            'executor_git_blob':'26f9a7ed5529a98911a5d948e365eae611a0af8b','tests':8,'failures':0,'errors':0,'skipped':0,
            'executor_compiled':True,'executor_imported':True,'requests_version':'2.32.5','network_disabled_during_tests_and_import':True,
            'private_input_authority':{'lock_sha256':'8a00c6681cebdd190da667711b7479d22ffcd175e677b0c740037eeab6976f1a','object_manifest_sha256':'79edba98bc3e61ee8c1be36174eb02e050c112478563f1119a8f7b330dccd795','soda_request_manifest_sha256':'d5c66c1288621e6826b56fb02658dd9bddcb449f82fa10eec135959b67436904','objects':188,'planned_requests':940,'bytes_reloaded_in_this_zero_data_preflight':False},
            'payload_released_for_scientific_execution':False,'soda_requests_sent':0,'image_bytes_downloaded':0,'scores_computed':False,'unknown_dr5_only_targets_queried':0,
          }
          pathlib.Path('/tmp/result/P4_5_FINAL_RUNTIME_PREFLIGHT_RECEIPT.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps(receipt,sort_keys=True))
          PY3

      - name: Upload final runtime preflight receipt
        uses: actions/upload-artifact@v4
        with:
          name: hou-lens-p4-5-final-runtime-preflight-${{ github.run_id }}
          path: /tmp/result/P4_5_FINAL_RUNTIME_PREFLIGHT_RECEIPT.json
          retention-days: 3
